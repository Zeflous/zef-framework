# SonarCloud quality gate: cloud-side static analysis (bugs, vulnerabilities,
# code smells, duplications, security hotspots) over src/ and tests/.
#
# Design notes — read docs/security/sonarcloud.md before changing this file:
#   * This is the "CI Security/Review" lane of the pipeline: the main CI job
#     (PHPStan max level, Deptrac, coverage, style) proves structural and
#     behavioural correctness locally; this lane adds an independent cloud
#     reviewer whose findings surface as pull-request decoration and a
#     blocking quality-gate verdict.
#   * The job name below is load-bearing: it must stay exactly "SonarCloud
#     Scan" — that context IS a required status-check on the protected main
#     branch (same contract as "PHP lint, audit, static analysis and style" in
#     ci.yml and "Build API documentation" in docs-check.yml).
#   * REQUIRED-CHECK CONTRACT (2026-09-28, measured on PR #208): this job's
#     context "SonarCloud Scan" is a REQUIRED status check on the protected
#     main branch. The previous design guarded fork/dependabot pull requests
#     with a job-level `if:`, leaving the check in the "skipped" conclusion
#     there. PR #208 (dependabot) measured what that means live: branch
#     protection DID eventually accept the skipped check and the PR merged
#     full-auto — opened 23:08 UTC, CI settled 23:23-23:25 UTC, auto-merge
#     fired 23:40 UTC (GitHub's auto-merge evaluation is lazy, not strictly
#     event-driven) — but the acceptance scores an undocumented conclusion,
#     and the pull request carries a grey icon with no explanation of why no
#     analysis ran. This job therefore ALWAYS runs and concludes: it reports
#     GREEN WITH A NOTICE whenever it cannot scan credentialed —
#       - SONAR_TOKEN absent or withheld: the repository secret is not set
#         yet, or this is a pull_request event where GitHub withholds
#         repository secrets (a dependabot[bot] author, or a head from a
#         fork).
#     The green is not silent — the notice step writes a step summary and a
#     `::notice::` annotation stating exactly why no analysis ran, and the
#     success conclusion (instead of "skipped") makes the required check's
#     outcome deterministic rather than reliant on how GitHub scores skipped
#     conclusions. Those PRs change no PHP this gate could newly judge
#     (dependabot bumps pinned action SHAs) and remain fully gated by the CI
#     lane. Never use pull_request_target to work around the secret
#     withholding.
#   * BLOCKING quality gate: sonar.qualitygate.wait=true in
#     sonar-project.properties makes the scanner wait for the server-side
#     verdict; a red gate fails this job.
#   * COVERAGE BRIDGE (v2, 2026-09-28): the CI lane uploads build/clover.xml
#     as the artifact "coverage-clover" for every commit it analyses. This
#     job waits for the CI run of the SAME commit, downloads that artifact
#     and passes sonar.php.coverage.reportPaths to the scanner, so the
#     quality gate's coverage-on-new-code condition is enforced on real
#     PHPUnit data. When coverage genuinely cannot be bridged (CI red, no CI
#     run within its own 45-minute bound, artifact unavailable) the run
#     falls back to sonar.coverage.exclusions=**/* FOR THAT ONE RUN, always
#     announced in the step summary and via ::notice:: — never silently.
#     See docs/security/sonarcloud.md section 6.
#
# All actions are pinned to a full commit SHA, matching the convention used in
# .github/workflows/ci.yml.

name: SonarCloud

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-24.04
    # Budget: the coverage bridge polls the CI lane for up to 45 minutes (the
    # CI job's own timeout bound, ci.yml) and the scan itself takes ~3-4
    # minutes; typical total is ~20 minutes (CI lane completes in ~15).
    timeout-minutes: 60
    permissions:
      contents: read  # actions/checkout to fetch code
      actions: read  # fetch the CI lane's coverage-clover artifact (bridge v2)
    env:
      # Scoped to the job (not the workflow) so no unrelated job can ever
      # receive it. Never echo, log, or print this value.
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: https://sonarcloud.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report unconfigured state (SONAR_TOKEN absent or withheld)
        # Deliberate contract: whenever this job cannot scan credentialed —
        # the repository secret SONAR_TOKEN is not set, or this is a
        # pull_request event where GitHub withholds repository secrets (a
        # dependabot[bot] author or a fork head) — the job is GREEN WITH A
        # NOTICE, never red and never silently green. The job must always run
        # and conclude: its context is a REQUIRED status check, and a real
        # success conclusion (with the notice explaining exactly what happened)
        # is a deterministic, self-documenting outcome — PR #208 (2026-09-28)
        # measured that a job-level skip is eventually accepted by branch
        # protection, but it leaves a grey icon and an undocumented
        # conclusion in its wake.
        if: env.SONAR_TOKEN == ''
        run: |
          {
            echo "### SonarCloud Scan — skipped (no credentials in this context)"
            echo ""
            echo "No credentialed SonarCloud analysis ran for this commit: either"
            echo "the repository secret \`SONAR_TOKEN\` is not set, or this is a"
            echo "pull request whose secrets GitHub withholds (a \`dependabot[bot]\`"
            echo "author, or a head from a fork). The check reports green so an"
            echo "unconfigured or uncredentialed gate cannot block the PR queue;"
            echo "the CI lane still gates these pull requests fully."
            echo ""
            echo "Setup checklist: docs/security/sonarcloud.md, section 3."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::notice::SONAR_TOKEN unavailable in this context — SonarCloud analysis skipped (setup: docs/security/sonarcloud.md)."

      - name: Wait for the CI lane and fetch its coverage artifact (bridge v2)
        # Coverage bridge v2 — docs/security/sonarcloud.md section 6. The CI
        # job uploads build/clover.xml as the artifact "coverage-clover" for
        # every commit it analyses; this step consumes the artifact of the
        # SAME commit so the scanner's coverage-on-new-code gate condition is
        # computed on real data. It usually just waits for the in-flight CI
        # run to finish.
        #
        # SHA RESOLUTION (live bug, PR #209, 2026-09-28): the Actions API
        # reports workflow runs by the sha of the head that triggered them —
        # the pull request HEAD on pull_request events, the branch head on
        # push. GITHUB_SHA inside a pull_request job is NOT that sha: it is
        # the ephemeral merge commit of refs/pull/N/merge. Querying
        # "actions/runs?head_sha=<merge commit>" therefore matches NOTHING —
        # measured live: the CI lane had completed, yet the bridge kept
        # polling toward its deadline. The PR head sha is resolved from the
        # event payload itself, the authoritative source.
        if: env.SONAR_TOKEN != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ] && [ -f "${GITHUB_EVENT_PATH}" ]; then
            pr_head=$(jq -r '.pull_request.head.sha // empty' "${GITHUB_EVENT_PATH}" 2>/dev/null || true)
            if [ -n "${pr_head}" ]; then
              sha="${pr_head}"
            fi
          fi
          echo "Bridging coverage for reported head sha ${sha:0:8} (event: ${GITHUB_EVENT_NAME})."
          # Match the CI job's own bound (timeout-minutes: 45 in ci.yml):
          # beyond it the CI lane has failed on its own terms and this gate
          # must not hold the check open longer than the lane it feeds on.
          deadline=$(( $(date +%s) + 45 * 60 ))

          run_id=""
          last_state="not started yet"
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            run_id=$(gh api --method GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=1" \
              --jq '.workflow_runs[0].id // empty' 2>/dev/null) || run_id=""
            if [ -n "${run_id}" ]; then
              info=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
                --jq '{status: .status, conclusion: .conclusion}' 2>/dev/null) || info='{}'
              st=$(printf '%s' "${info}" | jq -r '.status // "unknown"')
              cl=$(printf '%s' "${info}" | jq -r '.conclusion // ""')
              last_state="${st} ${cl:-running}"
              if [ "${st}" = "completed" ]; then
                break
              fi
            fi
            echo "CI run for ${sha:0:8}: ${last_state}; polling again in 30s..."
            sleep 30
          done

          verdict="fallback"
          args="-Dsonar.coverage.exclusions=**/*"
          if [ -n "${run_id}" ]; then
            cl=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.conclusion // "unknown"' 2>/dev/null) || cl="unknown"
            if [ "${cl}" = "success" ]; then
              rm -rf build
              mkdir -p build
              if gh run download "${run_id}" --name coverage-clover --dir build 2>/dev/null; then
                if [ -s build/clover.xml ] && grep -q '<coverage' build/clover.xml 2>/dev/null; then
                  args="-Dsonar.php.coverage.reportPaths=build/clover.xml"
                  verdict="bridged"
                else
                  echo "::warning::coverage-clover artifact fetched but build/clover.xml is absent or not a clover report — coverage excluded for this run."
                fi
              else
                echo "::warning::coverage-clover artifact of CI run ${run_id} could not be fetched (expired or missing) — coverage excluded for this run."
              fi
            else
              echo "::notice::CI run ${run_id} ended '${cl}' — no coverage artifact to bridge; the CI lane itself already reports this commit red."
            fi
          else
            echo "::notice::No completed CI run for ${sha:0:8} within 45 minutes — coverage excluded for this run."
          fi

          {
            echo "### Coverage bridge (v2)"
            echo ""
            echo "- verdict: **${verdict}**"
            if [ "${verdict}" = "bridged" ]; then
              echo "- PHPUnit clover report consumed from the CI lane's \`coverage-clover\` artifact (run ${run_id}); the quality gate's coverage-on-new-code condition is enforced on real data."
            else
              echo "- No coverage data was available for this commit, so \`sonar.coverage.exclusions=**/*\` applies to THIS run only and the coverage-on-new-code condition is skipped. Every other condition (bugs, vulnerabilities, code smells, duplications, security hotspots) remains fully enforced, and the fallback is announced here and via \`::notice::\` — never silent."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

          # Hand the chosen scanner arguments to the scan step below.
          echo "COVERAGE_ARGS=${args}" >> "${GITHUB_ENV}"

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        with:
          args: ${{ env.COVERAGE_ARGS }}
