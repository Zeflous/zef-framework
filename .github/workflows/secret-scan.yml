name: Secret Scan

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # gitleaks-action v3 requires a license for ORGANIZATION-owned repos
          # (personal accounts scan for free). The repository moved to the
          # Zeflous organization on 2026-09-28, so the free-personal mode
          # stopped applying and every run failed with "missing gitleaks
          # license". The license key for this org is stored as the
          # repository secret GITLEAKS_LICENSE and MUST be passed explicitly:
          # GitHub does not inject secrets into actions on its own.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
