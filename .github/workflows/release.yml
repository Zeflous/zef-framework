name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Baseline: no workflow-level write authority. Only the publish job may write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Read-only build job. Produces the source artifact plus a SHA-256 checksum.
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    # Must exceed the tag-triggered mutation gate it WAITS for, not just the
    # own-build time: Infection measured 69 min on the v2.30.0 tag, so 45 min
    # killed the push-triggered release run before the verify step could see
    # the mutation verdict (run 36199788068, same death as v2.29.0's push run
    # 36171241865). 200 min = mutation's own 120-min timeout + the 180-min
    # verify deadline cannot both be exceeded by this ceiling first.
    timeout-minutes: 200
    permissions:
      contents: read
      id-token: write # required for keyless (OIDC) build-provenance attestation
      attestations: write # required to persist the attestation to the attestation store

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid SemVer tag: $tag"
            exit 1
          fi

      - name: Verify required CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git rev-list -n 1 "$GITHUB_REF")"

          # A tag may legitimately be pushed while the commit's
          # pull_request runs are still queued or in progress. Judging a
          # non-terminal run as a failure made a valid release fail
          # spuriously (run 35810165581: ci.yml was still in_progress, so
          # the conclusion came back empty and the gate aborted). Wait for
          # each required workflow to reach a terminal state — bounded, so
          # a permanently stuck run still fails closed instead of hanging
          # until the job timeout — and only then evaluate its conclusion.
          #
          # mutation.yml is in this list because the aggregate Infection
          # suite was MOVED there out of ci.yml (see docs/GOVERNANCE.md 2.5).
          # A gate that is not waited on is not a gate: without this entry the
          # release would be published without the mutation verdict ever being
          # read. The deadline must exceed the mutation job's own
          # timeout-minutes (120) plus the CI job's (45), otherwise a tag pushed
          # while the suite is in flight would trip the deadline instead of
          # waiting for the verdict. 10800s = 180 min covers them in sequence.
          deadline=$((SECONDS + 10800))
          # php-sast.yml is in this list because the Semgrep gate is a
          # required status check on main: a release must not be published
          # from a commit whose SAST verdict was never read. Without this
          # entry the release could ship while the SAST run was still red.
          for workflow in "ci.yml" "mutation.yml" "secret-scan.yml" "phpbench.yml" "php-sast.yml"; do
            status=""
            conclusion=""
            while :; do
              line="$(gh run list --repo "${{ github.repository }}" --workflow "$workflow" --commit "$sha" --limit 1 --json status,conclusion --jq '.[0] // {} | "\(.status // "none") \(.conclusion // "none")"' 2>/dev/null || true)"
              status="${line%% *}"
              conclusion="${line##* }"
              if [ "$status" != "completed" ]; then
                if [ "$SECONDS" -ge "$deadline" ]; then
                  echo "$workflow did not reach a terminal state for $sha: ${status:-unknown}"
                  exit 1
                fi
                echo "$workflow is ${status:-unknown} for $sha - waiting"
                sleep 30
                continue
              fi
              break
            done
            if [ "$conclusion" != "success" ]; then
              echo "$workflow has not passed for $sha: $conclusion"
              exit 1
            fi
            echo "$workflow passed for $sha"
          done

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      # The archive is written outside the working tree: writing it inside the
      # tree made tar read its own output ("file changed as we read it", exit 1).
      # It is then moved in, so the checksum, upload, attest and publish steps
      # keep operating on the same relative path as before.
      - name: Create source artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/zef-framework-${GITHUB_REF_NAME}.tar.gz"
          tar --exclude-vcs --exclude=build -czf "$archive" .
          mv "$archive" "zef-framework-${GITHUB_REF_NAME}.tar.gz"
          ls -l "zef-framework-${GITHUB_REF_NAME}.tar.gz"

      - name: Generate SHA-256 checksum
        run: |
          sha256sum "zef-framework-${GITHUB_REF_NAME}.tar.gz" > "zef-framework-${GITHUB_REF_NAME}.tar.gz.sha256"
          echo "--- release integrity ---"
          cat "zef-framework-${GITHUB_REF_NAME}.tar.gz.sha256"

      - name: Upload release artifact and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            zef-framework-*.tar.gz
            zef-framework-*.tar.gz.sha256
          if-no-files-found: error

      # Keyless provenance attestation: signed via GitHub Actions OIDC.
      # No long-lived signing key is used. Blocking: if the attestation cannot
      # be persisted the release fails, so a provenance regression cannot pass
      # silently.
      - name: Attest build provenance (keyless, OIDC)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: zef-framework-${{ github.ref_name }}.tar.gz

  # Privileged publish job: only publishes the verified artifact.
  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write # required for keyless (OIDC) SBOM attestation (#352)
      attestations: write # required to persist the attestation to the attestation store (#352)

    steps:
      # gh release create needs a git work tree to resolve the repository
      # (without it: "fatal: not a git repository"). Same pinned SHA as the
      # build job; full history so --generate-notes and --verify-tag always
      # have the refs they need.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifact and checksum
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: .

      # SBOM is a release artifact and this job is its single writer (#352):
      # generate here and attach inside the create-or-upload step below. The
      # former sbom-release job in sbom.yml raced the publish (attach ran ~20s
      # after the tag push, the release only exists after this job's mutation-
      # gate wait), silently skipped whenever no release object existed yet,
      # and shipped v2.31.0 and v2.34.1 without a SBOM asset while green.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2 (same pin as sbom-generate.yml)
        with:
          path: .
          format: cyclonedx-json
          output-file: zef-framework-sbom.cdx.json

      - name: Verify SBOM artifact is present and non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s zef-framework-sbom.cdx.json
          echo "SBOM bytes: $(wc -c < zef-framework-sbom.cdx.json)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Idempotent create-or-upload: a release can legitimately exist
          # before this step runs (manually published during an incident
          # remediation, as happened on v2.32.0 when the SBOM attach race
          # was patched by hand). Creating would then fail with "a release
          # with the same tag name already exists" and mark the tag run
          # red even though the release itself is complete — so refresh
          # the artifacts on the existing release instead. --clobber only
          # replaces same-named assets; the SBOM asset is uploaded below by
          # THIS job (single writer, #352) — no other workflow touches it.
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "zef-framework-${GITHUB_REF_NAME}.tar.gz" \
              "zef-framework-${GITHUB_REF_NAME}.tar.gz.sha256" \
              "zef-framework-sbom.cdx.json" \
              --clobber
            # Close the draft blind-spot (v2.32.0 AND v2.33.0, both measured):
            # Release Drafter maintains a rolling draft for the NEXT version on
            # main pushes, and its predicted name can equal this tag exactly
            # (v2.33.0: prediction matched, so the release this step found was
            # the DRAFTER's draft). The upload above landed the final assets on
            # that draft, which then sat unpublished until someone pressed the
            # button by hand both times. This workflow OWNS the publish step
            # for tag pushes, so it completes it: if the release we just
            # refreshed is still a draft, publish it and make it latest. A
            # non-draft release (the manually-published-during-remediation
            # case this branch was originally written for) is left untouched.
            is_draft=$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq '.isDraft')
            if [ "${is_draft}" = "true" ]; then
              gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
              echo "Existing DRAFT published by this run (Release Drafter blind-spot closed)."
            else
              echo "Existing release was already published; assets refreshed only."
            fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              "zef-framework-${GITHUB_REF_NAME}.tar.gz" \
              "zef-framework-${GITHUB_REF_NAME}.tar.gz.sha256" \
              "zef-framework-sbom.cdx.json" \
              --generate-notes \
              --verify-tag
          fi

      # Keyless SBOM attestation via GitHub Actions OIDC (no long-lived key).
      # Blocking: if the attestation cannot be persisted the run fails, so an
      # attestation regression cannot pass silently. Same contract as the
      # branch lane in sbom-generate.yml.
      - name: Attest SBOM (keyless, OIDC)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0 (same pin as sbom-generate.yml)
        with:
          subject-path: zef-framework-sbom.cdx.json
          sbom-path: zef-framework-sbom.cdx.json

      # Fail-loud guard for the failure mode that shipped v2.31.0 and
      # v2.34.1 without a SBOM asset while every job stayed green (#352):
      # assert the asset is actually present on the release before this run
      # can be called a success.
      - name: Assert SBOM asset is attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets=$(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[].name')
          echo "Release assets:"
          echo "${assets}"
          if ! echo "${assets}" | grep -Fxq "zef-framework-sbom.cdx.json"; then
            echo "::error::SBOM asset zef-framework-sbom.cdx.json is missing from release ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "SBOM asset attached: OK"
