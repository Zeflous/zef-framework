name: SBOM

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

# Role split (#352): this workflow is the BRANCH attestation lane only —
# generation, artifact upload and keyless OIDC attestation for every commit
# that lands on main, least-privilege (contents: read), no release interaction.
#
# The release-attached SBOM asset is owned exclusively by the `publish` job in
# release.yml (single writer, runs after the mutation gate with the release
# guaranteed to exist — no race). The former tag-triggered `sbom-release` job
# here relied on anchore/sbom-action's implicit attach, which silently skipped
# whenever the release did not exist yet at attach time: v2.31.0 and v2.34.1
# shipped without a SBOM asset while the job stayed green. Tag commits are
# already attested by the main-branch run (tags only point at main commits),
# and release.yml re-attests on the tag ref for belt-and-braces evidence.

jobs:
  sbom:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      id-token: write # required for keyless (OIDC) SBOM attestation
      attestations: write # required to persist the attestation to the attestation store
    uses: ./.github/workflows/sbom-generate.yml
