name: SBOM

on:
  push:
    branches: ["main"]
    # Release tags too: the SBOM is a release artifact, and a tag pushed
    # without a preceding main-branch push (or with the main run superseded)
    # would otherwise ship a release with no SBOM evidence for that commit.
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sbom:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Least-privilege stays intact on branch pushes (read). On tag pushes the
      # anchore/sbom-action attaches the generated SBOM to the release matching
      # the tag, which requires contents:write — without it, a release that
      # already exists when the tag run reaches the attach fails with
      # "Resource not accessible by integration" (v2.32.0 tag run 36711454066;
      # v2.31.0 only dodged this by timing — its release was published after
      # the tag run had finished, so the attach was skipped entirely).
      contents: ${{ github.ref_type == 'tag' && 'write' || 'read' }}
      id-token: write # required for keyless (OIDC) SBOM attestation
      attestations: write # required to persist the attestation to the attestation store
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare SBOM output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -d build

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: build/sbom.cdx.json

      - name: Verify SBOM artifact is present and non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s build/sbom.cdx.json
          echo "SBOM bytes: $(wc -c < build/sbom.cdx.json)"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zef-sbom-${{ github.sha }}
          path: build/sbom.cdx.json
          if-no-files-found: error

      # Keyless SBOM attestation via GitHub Actions OIDC (no long-lived key).
      # Blocking: if the attestation cannot be persisted the run fails, so an
      # attestation regression cannot pass silently.
      - name: Attest SBOM (keyless, OIDC)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: build/sbom.cdx.json
          sbom-path: build/sbom.cdx.json
