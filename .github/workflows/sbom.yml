name: SBOM

on:
  push:
    branches: ["main"]
    # Release tags too: the SBOM is a release artifact, and a tag pushed
    # without a preceding main-branch push (or with the main run superseded)
    # would otherwise ship a release with no SBOM evidence for that commit.
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sbom-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Branch pushes + workflow_dispatch on branches: least-privilege (read) —
  # generation, artifact upload and keyless OIDC attestation only; no release
  # interaction. Identical to the previous single-job behavior.
  sbom:
    if: github.ref_type != 'tag'
    permissions:
      contents: read
      id-token: write # required for keyless (OIDC) SBOM attestation
      attestations: write # required to persist the attestation to the attestation store
    uses: ./.github/workflows/sbom-generate.yml

  # Tag pushes: the anchore/sbom-action attaches the generated SBOM to the
  # release matching the tag, which requires contents:write. The v2.32.0 tag
  # run failed with "Resource not accessible by integration" because the job
  # only carried contents:read and the release had already been published
  # before the run reached the attach; v2.31.0 only dodged it by timing (its
  # release was published after the tag run finished, so the attach was
  # skipped entirely and the release shipped without a SBOM asset).
  sbom-release:
    if: github.ref_type == 'tag'
    permissions:
      contents: write # attach the SBOM asset to the tagged release
      id-token: write # required for keyless (OIDC) SBOM attestation
      attestations: write # required to persist the attestation to the attestation store
    uses: ./.github/workflows/sbom-generate.yml
