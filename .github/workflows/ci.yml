name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

# Cancel superseded runs for the same ref instead of queueing work behind them.
# Since the Infection suite moved to mutation.yml this job is fast; the policy is
# kept because the cheap per-zone ratchet still fails a pull request within
# minutes of the push, and superseding a stale run keeps that signal current.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege: this pipeline only reads the repository (checkout,
# dependency install, analysis, tests). No artifacts, caches or PR comments
# are written, so the GITHUB_TOKEN needs nothing beyond contents: read.
permissions:
  contents: read

# Explicit environment: dependency installation intentionally skips
# Composer's built-in advisory audit (it is covered by the dedicated
# "Abandoned-package audit policy" step below). Declared here so the
# behaviour is reproducible and not inherited from runner image defaults.
env:
  COMPOSER_NO_AUDIT: "1"

jobs:
  test:
    # Job name must match the required status-check context enforced by
    # branch protection on main ("PHP lint, audit, static analysis and style")
    # so the check registers against the policy instead of pending forever.
    # NOTE: no matrix strategy on purpose — GitHub Actions appends matrix
    # values to static job names as a " (8.4)" suffix, which would break the
    # exact-match against the required context again.
    name: PHP lint, audit, static analysis and style
    runs-on: ubuntu-latest
    # Bound the job so a stuck step self-terminates instead of holding the
    # required status check open forever. Without this bound, a hung run is
    # indistinguishable from a slow one from the outside (the run's updated_at
    # freezes at job start), and the required context can stay pending
    # indefinitely. Budget: with the Infection suite relocated to mutation.yml
    # this job is a few minutes (lint, static analysis, coverage, zone ratchet);
    # 45 min is generous headroom without allowing an unbounded hang.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          # The 90% coverage gate was calibrated against Xdebug's statement
          # counting. pcov measures this suite ~2% lower (89.86% vs 92.02%
          # for the same execution profile), which would fail the gate that
          # the archive's own baseline passes. Use Xdebug for parity with
          # the environment the threshold was authored in.
          coverage: xdebug
          # redis: RedisStoreTest requires the phpredis client extension;
          # without it the suite self-skips and the rate-limiter coverage
          # silently disappears (declared as ext-redis in require-dev so
          # `composer install` also fails loudly when it is absent).
          extensions: mbstring, dom, xml, xmlwriter, apcu, redis
          ini-values: apc.enable_cli=1
          # Pinned toolchain: the composer binary is provisioned by the
          # SHA-pinned setup-php action instead of piping getcomposer.org
          # straight into php (no unverified remote code execution).
          tools: composer:2.10.3

      - name: Start Redis test server (127.0.0.1:6399)
        # RedisStoreTest connects to 127.0.0.1:6399 with password
        # 'zef-test-secret' (see tests/Unit/RedisStoreTest.php). Without a
        # live server the phpredis-backed integration tests cannot run.
        run: |
          docker run -d --name zef-redis \
            -p 127.0.0.1:6399:6399 \
            redis:7-alpine redis-server --port 6399 --requirepass zef-test-secret
          for i in $(seq 1 30); do
            if docker exec zef-redis redis-cli -p 6399 -a zef-test-secret --no-auth-warning ping 2>/dev/null | grep -q PONG; then
              echo "Redis test server ready."
              exit 0
            fi
            sleep 1
          done
          echo "Redis test server failed to become ready."
          docker logs zef-redis
          exit 1

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Composer validation (strict)
        # Strict mode treats warnings as errors — restores main's policy for
        # the manifest that this PR itself reworked (+51 composer.json lines).
        run: composer validate --strict

      - name: Platform requirements check
        # Verifies that the runner platform satisfies every ext-* constraint
        # (root + lock packages: dom, xml, xmlwriter, mbstring, redis).
        run: composer check-platform-reqs

      - name: Abandoned-package audit policy
        run: composer run-script audit:security --no-interaction

      - name: Composer security audit (blocking)
        # The step above enforces the ABANDONED-package policy only. It never
        # asked Composer for advisories, and dependency installation runs with
        # COMPOSER_NO_AUDIT=1 (see the workflow-level env), so no step in this
        # pipeline consulted the advisory database at all: a known-vulnerable
        # locked dependency could reach main with every gate green.
        #
        # `composer audit` exits non-zero when an advisory affects a locked
        # package, which makes this step blocking. It is deliberately NOT
        # `--abandoned=fail`: abandonment is governed by the time-boxed
        # allowlist above, and duplicating that policy here would give the same
        # condition two different verdicts.
        run: composer audit --no-interaction

      - name: Syntax check (php -l over first-party files)
        run: php scripts/lint.php

      - name: Framework self-test suite
        run: php bin/zef --self-test

      - name: Autowiring suite (v2.9.0) standalone
        run: php bin/zef --self-test=v290

      - name: Enterprise suite (v2.10.0) standalone
        run: php bin/zef --self-test=v210

      - name: Radix-tree suite (v2.11.0) standalone
        run: php bin/zef --self-test=v211

      - name: PHPUnit (native in-process suites)
        # --log-junit feeds the release-docs ratchet below: build/junit.xml
        # is the evidence file behind the README test-count badge, so a PR
        # that adds tests but forgets the badge fails in the same PR
        # (issue #215, recurrence #87).
        run: vendor/bin/phpunit --log-junit build/junit.xml

      - name: PHPStan (level max + strict-rules + frozen baseline)
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon.dist --memory-limit=1G --no-progress

      - name: PHPStan baseline ratchet (no-new-debt)
        # The step above reports 0 errors because phpstan-baseline.neon suppresses
        # every finding it lists — the static-analysis debt is invisible to CI and
        # there was nothing stopping `--generate-baseline` from absorbing new errors.
        # This gate freezes the suppressed count in phpstan-baseline.limit and fails
        # when it grows; a cleanup PR that removes entries is reported as a ratchet
        # opportunity instead of being blocked.
        # See docs/quality/phpstan-baseline-ratchet.md.
        run: composer stan:ratchet

      - name: Architecture rules (deptrac)
        # Parity with `composer deptrac` (the documented local gate): the
        # --fail-on-uncovered flag must match on both sides. Without it the
        # workflow stayed green while the local gate went red — exactly how
        # the first uncovered vendor edge (v2.29.0 Doctor -> Spiral PSR7Worker)
        # reached main unnoticed (issue #94 follow-up).
        run: vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress --fail-on-uncovered

      - name: "Code style (php-cs-fixer: PER-CS2.0 + Symfony + PhpCsFixer + PHP84)"
        run: vendor/bin/php-cs-fixer check --diff --using-cache=no

      - name: phpDoc & type-hint annotations (phpcs + Slevomat)
        run: vendor/bin/phpcs

      - name: Code coverage gate (>= 90% statements)
        # Statement floor only. The branch floor this step used to pass (70)
        # could never be satisfied: PHPUnit 10.5's clover writer emits zero
        # conditionals because its runner never enables XDEBUG_CC_BRANCH_CHECK,
        # so the assertion aborted with "report contains zero conditionals" on
        # every run. The branch floor is deferred to a PHPUnit upgrade that can
        # actually measure branches; the script still enforces it when a branch
        # threshold argument is supplied.
        run: |
          vendor/bin/phpunit --coverage-clover build/clover.xml
          php scripts/ci/assert-coverage.php 90 build/clover.xml

      - name: Upload coverage evidence (clover.xml)
        # The coverage gate parsed build/clover.xml and then threw it away: the
        # report was never uploaded, so the only trace of a run's coverage was
        # the assertion line in the log. Upload it (always, including on
        # failure) so the evidence behind the >=90% claim is retrievable from
        # the run and can be diffed across revisions.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-clover
          path: build/clover.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Zone mutation ratchet
        # Kept on the push/PR path ON PURPOSE. The aggregate Infection suite this
        # ratchet complements moved to mutation.yml (release tags and dispatch) —
        # see docs/GOVERNANCE.md 2.5 — because its verdict is a property of the
        # committed tree, not of the change under review, and it held the
        # required check open for ~55 minutes per push. This ratchet is what
        # still fails a pull request minutes after the push when a zone
        # regressed, instead of deferring that discovery to release time. It
        # re-runs no suite, so the cost it adds to a PR is a table read.
        #
        # The enforced aggregate gate it complements is AGGREGATE (--min-msi=85 /
        # --min-covered-msi=90 over ~9.4k mutants). It cannot see a single area:
        # one zone may regress from 94% to 60% and the aggregate absorbs it, so
        # the owner target of "MSI >= 95% per area/module" had no gate at all.
        #
        # This step is a RATCHET over committed evidence in docs/mutation/
        # (scripts/f16_zones.tsv is the canonical zone list). It re-runs no
        # mutation suite. It asserts that every canonical zone has a measured
        # row in docs/mutation/zones.tsv, that a row claiming OK really is at or
        # above the floor, that DEBT/UNKNOWN rows carry a reason and a source,
        # and — the core check — that no zone has regressed below the frozen
        # per-zone floor in docs/mutation/baseline.tsv. Closing a zone requires
        # writing tests and re-measuring; the score can only move up without a
        # deliberate, reviewable edit of the baseline.
        # See docs/mutation/README.md for the format and the campaign tooling.
        run: composer mutation:zones

      - name: Release cadence ratchet (tag ↔ changelog)
        # Issue #88: eleven minors (v2.18.0 → v2.27.0) shipped as changelog
        # files with no tag and no GitHub release, so the "documented release"
        # references drifted three to nine minors behind ZefVersion. This gate
        # asserts (fail-closed) that every v2+ tag carries its
        # docs/CHANGELOG-v{tag}.md and that the newest tag never runs ahead of
        # ZefVersion::VERSION. One-directional on purpose: a changelog file
        # without a tag is a legitimate pre-release state — the version-bump
        # PR lands the changelog first and the tag ships with the same merge
        # (see docs/GOVERNANCE.md 2.6).
        run: php scripts/ci/assert-release-cadence.php

      - name: Release docs ratchet (README/SECURITY ↔ ZefVersion)
        # Issue #87: the README badge and SECURITY.md supported-versions table
        # drifted up to nine minors behind ZefVersion::VERSION, misstating the
        # documented release to new readers and security reporters. This gate
        # (fail-closed) pins those references to the code's own version, so a
        # version-bump PR that forgets the docs fails in the same PR instead
        # of drifting. One-directional on purpose: the docs follow the code,
        # never the other way round.
        run: php scripts/ci/assert-release-docs.php

      - name: Documentation count ratchet (README layout vs repo)
        # Pins the README "Struktur Proyek" tree and CI/CD prose counters to the
        # working tree (src/tests file counts, CHANGELOG files, workflow files)
        # — the drift class audit v24 found (src 360 vs 640, changelog 25 vs 42,
        # workflows 13 vs 20). Version/class/test counts stay with
        # assert-release-docs.php; this gate covers the layout counts.
        run: php scripts/ci/assert-doc-counts.php

      - name: Rector (dry-run)
        run: vendor/bin/rector process --dry-run --no-progress-bar

  zero-composer:
    # Zero-composer path guard (audit v24). Every other job runs
    # `composer install` first, so a class present under src/ but missing from
    # the hand-maintained static classmap (autoload/zef_autoload.php) passes CI
    # while the documented "no Composer" install path fatals at runtime — the
    # v2.36.0 defect where `php bin/zef route:list` died with
    # "Class Zef\Framework\Console\Inspector\RouteLister not found".
    # This job deliberately installs NOTHING: it exercises bin/zef on the raw
    # checkout, exactly as a zero-composer user does.
    name: Zero-composer boot path
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, dom, xml, xmlwriter

      - name: Assert vendor/ is absent (true zero-composer run)
        run: test ! -d vendor

      - name: Framework self-test (static classmap only)
        run: php bin/zef --self-test

      - name: route:list resolves on the static classmap
        run: php bin/zef route:list --json > /dev/null

  platform-windows:
    # Issue #92: platform coverage restoration. The archive-era matrix
    # (collapsed in PR #22, finding F-03) is rebuilt as dedicated
    # STATIC-NAMED jobs instead of a matrix strategy: GitHub Actions
    # suffixes matrix values onto job names (" (8.4)"), which breaks the
    # exact-match against the required status-check context (the PR #22
    # lesson, relearned when the job rename landed in #93's follow-ups).
    # Static names keep the required context set untouched.
    #
    # REQUIRED: this cell is in the branch-protection required contexts on
    # main ("Platform smoke (windows-latest)"), so a red step here blocks a
    # merge. It was promoted after the issue #110 burn-down landed and the
    # 26 inventoried platform failures were fixed. A red Kilo bot check with
    # an infra-flake signature is still not a code verdict — see
    # docs/GOVERNANCE.md 2.7.
    name: Platform smoke (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          coverage: none
          # The per-platform Redis profile (issue #92): Windows runners
          # support no service containers, so no Redis server exists there,
          # and loading ext-redis WITHOUT a server turns the suite into 9
          # hard errors (modern phpredis throws in setUp, so the
          # isAvailable() guard never returns false — the exact failure
          # mode diagnosed during PR #82/#22). Not loading ext-redis at all
          # gives the graceful profile: RedisStoreTest self-skips, the
          # rate-limiter wire tests drop out, nothing fails.
          extensions: mbstring, dom, xml, xmlwriter, curl, pdo_sqlite, apcu, sockets
          ini-values: apc.enable_cli=1
          tools: composer:2.10.3

      - name: Install dependencies (graceful profile without ext-redis)
        run: composer install --no-interaction --no-progress --ignore-platform-req=ext-redis

      - name: Syntax check (php -l over first-party files)
        run: php scripts/lint.php

      - name: Framework self-test suite
        run: php bin/zef --self-test

      - name: PHPUnit (Redis-skip profile)
        # BLOCKING since the issue #110 burn-down landed: the 26 inventoried
        # platform failures are fixed (Windows-aware make:app path
        # arithmetic, POSIX-gated restrictive-mode contracts, Unix-only
        # failure-injection guards, pcntl_fork skip, putenv-based CLI env).
        # What cannot run on this profile self-skips (Redis suite, fork
        # transports, chmod injections) — a red step is a platform verdict
        # again, not debt. Promote the cell to required contexts with this.
        run: vendor/bin/phpunit

  platform-php85:
    # Issue #92: the PHP 8.5 column. The dependency set is verified
    # 8.5-compatible BEFORE landing this job (`composer why-not php 8.5.0`
    # reports no locked package constraining it), so the cell can join the
    # smoke set in the same PR as the Windows row instead of waiting for a
    # separate compat pass. Full profile: Redis service + ext-redis + APCu,
    # same as the canonical ubuntu/8.4 cell.
    name: Platform smoke (PHP 8.5)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.5"
          coverage: none
          extensions: mbstring, dom, xml, xmlwriter, curl, pdo_sqlite, apcu, redis
          ini-values: apc.enable_cli=1
          tools: composer:2.10.3

      - name: Start Redis test server (127.0.0.1:6399)
        run: |
          docker run -d --name zef-redis \
            -p 127.0.0.1:6399:6399 \
            redis:7-alpine redis-server --port 6399 --requirepass zef-test-secret
          for i in $(seq 1 30); do
            if docker exec zef-redis redis-cli -p 6399 -a zef-test-secret --no-auth-warning ping 2>/dev/null | grep -q PONG; then
              echo "Redis test server ready."
              exit 0
            fi
            sleep 1
          done
          echo "Redis test server failed to become ready."
          docker logs zef-redis
          exit 1

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Syntax check (php -l over first-party files)
        run: php scripts/lint.php

      - name: Framework self-test suite
        run: php bin/zef --self-test

      - name: PHPUnit (full profile incl. Redis wire tests)
        run: vendor/bin/phpunit
