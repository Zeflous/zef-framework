# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Snyk security scanning: Open Source (SCA), Code (SAST) and IaC.
#
# STRICT FAIL-CLOSED MODEL
# ------------------------
#   Snyk Code ───────┐
#   Snyk Open Source ├─ scan → upload evidence → strict verdict
#   Snyk IaC ────────┘
#
#   0                  → PASS
#   LOW finding        → FAIL
#   MEDIUM finding     → FAIL
#   HIGH finding       → FAIL
#   CRITICAL finding   → FAIL
#   scanner error      → FAIL
#   missing result     → FAIL
#
# Every scanner runs with `--severity-threshold=low`, so no severity tier is
# filtered out of the result set. Each scanner records its own exit code as a
# step output; the SARIF evidence is uploaded to GitHub Code Scanning BEFORE
# the verdict is computed; and a single explicit final verdict step fails the
# job unless all three scanners reported exit code 0.
#
# Exit-code contract (Snyk CLI): 0 = clean, 1 = findings, >1 = scanner error.
# Under this model 1 and >1 are both blocking — findings are no longer ignored.
#
# Requires the repository secret SNYK_TOKEN
# (https://github.com/snyk/actions#getting-your-snyk-token).
#
# All actions are pinned to a full commit SHA, matching the convention used in
# .github/workflows/ci.yml.

name: Snyk Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  snyk:
    name: snyk
    # Credentialed scans must never run against an untrusted fork pull request:
    # GitHub withholds secrets and downgrades the job token there, so the scan
    # cannot authenticate. Skipping keeps the check honest instead of reporting
    # a green-but-empty result. Never use pull_request_target to work around it.
    if: >-
      github.event_name != 'pull_request' ||
      (
        github.event.pull_request.head.repo.fork == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read # actions/checkout to fetch code
      security-events: write # github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    env:
      # Scoped to the job (not the workflow) so every Snyk step is
      # authenticated and no unrelated job can ever receive it.
      # Never echo, log, or print this value.
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Snyk CLI to check for security issues
        # Pinned commit from snyk/actions (no version tag moves with it).
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # pinned (snyk/actions)

      # Snyk Code (SAST). `--severity-threshold=low` reports every severity
      # tier, so any finding at all is surfaced. Exit 1 (findings) is recorded
      # and deliberately NOT masked: the final verdict step turns it into a
      # failure. Exit >1 is a genuine scanner error and is recorded the same
      # way, so the verdict step fails on it too.
      - name: Snyk Code test (SAST, SARIF output)
        id: snyk_code
        run: |
          rc=0
          snyk code test --severity-threshold=low --sarif-file-output=snyk-code.sarif || rc=$?
          echo "snyk code test exit code: ${rc} (0=clean, 1=findings, >1=error)"
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"

      # Snyk Open Source (SCA). This replaces the previous `snyk monitor`,
      # which only snapshotted the dependency graph to Snyk and never failed
      # on findings. `snyk test --all-projects` scans every detected project
      # and exits 1 when any vulnerability at or above the threshold is found,
      # so the dependency gate is now real and blocking.
      #
      # License-policy noise is handled in `.snyk` (the MIT dependencies of the
      # RoadRunner/PSR stack are explicitly allowed there, with a reason and an
      # expiry). No vulnerability is ignored: a real advisory still exits 1.
      - name: Snyk Open Source test (SCA, SARIF output)
        id: snyk_sca
        run: |
          rc=0
          snyk test --all-projects --severity-threshold=low --sarif-file-output=snyk-sca.sarif || rc=$?
          echo "snyk test exit code: ${rc} (0=clean, 1=findings, >1=error)"
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"

      # Snyk IaC. Same threshold and same exit-code contract as the two scans
      # above. The scan target is left at the repository root (as before), so
      # the deploy/ tree — Dockerfile, compose file and k8s manifests — is
      # covered without narrowing the scan to a subdirectory.
      - name: Snyk IaC test (SARIF output)
        id: snyk_iac
        run: |
          rc=0
          snyk iac test --severity-threshold=low --report --sarif-file-output=snyk-iac.sarif || rc=$?
          echo "snyk iac test exit code: ${rc} (0=clean, 1=findings, >1=error)"
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------------------
      # SARIF normalization. Snyk's SCA SARIF can carry a rule whose
      # `security-severity` is the literal string "undefined" (license issues
      # have no CVSS score), and GitHub Code Scanning rejects the whole file
      # with "invalid security severity value, is not a number: undefined".
      # Rewriting those values to 0.0 lets the SCA findings reach the Code
      # Scanning tab. This touches evidence only — the verdict below is still
      # computed from the scanner exit codes, so the gate stays fail-closed.
      # ---------------------------------------------------------------------
      - name: Normalize SARIF security-severity values
        if: always()
        run: python3 scripts/ci/normalize_sarif_severity.py snyk-code.sarif snyk-sca.sarif snyk-iac.sarif

      # ---------------------------------------------------------------------
      # Evidence upload. Runs even when a scan above reported findings, and
      # always BEFORE the verdict step, so the Code Scanning tab is populated
      # regardless of the verdict outcome. Each scanner writes its own SARIF
      # file (Snyk overwrites a shared path with the most recent scan).
      # ---------------------------------------------------------------------
      - name: Upload Snyk Code results to GitHub Code Scanning
        if: always() && hashFiles('snyk-code.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      - name: Upload Snyk Open Source results to GitHub Code Scanning
        if: always() && hashFiles('snyk-sca.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-sca.sarif
          category: snyk-open-source

      - name: Upload Snyk IaC results to GitHub Code Scanning
        if: always() && hashFiles('snyk-iac.sarif') != ''
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: snyk-iac.sarif
          category: snyk-iac

      # ---------------------------------------------------------------------
      # Explicit final verdict. Fail-closed: this is the ONLY place the job's
      # pass/fail is decided, and it passes only when every scanner reported
      # exit code 0.
      #
      #   exit 0        → PASS
      #   exit 1        → FAIL (findings are blocking, not ignored)
      #   exit >1       → FAIL (scanner error is blocking)
      #   missing/empty → FAIL (a scanner that produced no result cannot pass)
      #
      # `if: always()` guarantees the verdict is evaluated even when an earlier
      # step failed, so a failure can never be silently swallowed.
      # ---------------------------------------------------------------------
      - name: Snyk strict verdict (fail-closed)
        if: always()
        run: |
          set -u
          code_rc="${{ steps.snyk_code.outputs.exit_code }}"
          sca_rc="${{ steps.snyk_sca.outputs.exit_code }}"
          iac_rc="${{ steps.snyk_iac.outputs.exit_code }}"

          echo "Snyk strict verdict — scanner exit codes"
          echo "  snyk code test (SAST)       : ${code_rc:-<missing>}"
          echo "  snyk test (Open Source/SCA) : ${sca_rc:-<missing>}"
          echo "  snyk iac test (IaC)         : ${iac_rc:-<missing>}"
          echo "  0 = clean, 1 = findings, >1 = scanner error, <missing> = no result reported"

          verdict=0
          for pair in "code:${code_rc}" "open-source:${sca_rc}" "iac:${iac_rc}"; do
            name="${pair%%:*}"
            rc="${pair#*:}"
            if [ -z "${rc}" ]; then
              echo "::error::${name}: no exit code reported (missing result) — FAIL"
              verdict=1
            elif [ "${rc}" -ne 0 ]; then
              echo "::error::${name}: exit code ${rc} (1=findings, >1=scanner error) — FAIL"
              verdict=1
            else
              echo "${name}: exit code 0 — PASS"
            fi
          done

          if [ "${verdict}" -ne 0 ]; then
            echo "::error::Snyk strict verdict: FAIL — at least one scanner did not report exit code 0"
            exit 1
          fi
          echo "Snyk strict verdict: PASS — all scanners reported exit code 0"
