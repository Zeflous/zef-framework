name: SBOM generation (reusable)

# Reusable pipeline shared by the SBOM callers in sbom.yml:
#   - branch pushes: contents:read (generation + attestation only)
#   - tag pushes:    contents:write (also attaches the SBOM to the release)
# The GITHUB_TOKEN permissions are granted by the CALLING job and cannot be
# elevated here, so this file declares no permissions of its own.

on:
  workflow_call:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare SBOM output directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          test -d build

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: build/sbom.cdx.json

      - name: Verify SBOM artifact is present and non-empty
        shell: bash
        run: |
          set -euo pipefail
          test -s build/sbom.cdx.json
          echo "SBOM bytes: $(wc -c < build/sbom.cdx.json)"

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zef-sbom-${{ github.sha }}
          path: build/sbom.cdx.json
          if-no-files-found: error

      # Keyless SBOM attestation via GitHub Actions OIDC (no long-lived key).
      # Blocking: if the attestation cannot be persisted the run fails, so an
      # attestation regression cannot pass silently.
      - name: Attest SBOM (keyless, OIDC)
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: build/sbom.cdx.json
          sbom-path: build/sbom.cdx.json
