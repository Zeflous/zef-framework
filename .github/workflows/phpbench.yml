name: PHPBench Performance

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phpbench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: PHPBench
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The detection path MUST match the directory PHPBench actually reads.
      # It previously probed `tests/Benchmark`, which does not exist in this
      # repository (the suite lives in `benchmarks/`, per phpbench.json
      # `runner.path`). The probe therefore always reported "no benchmarks",
      # the run step was always skipped, and this job — which is a REQUIRED
      # status check on main — could never fail. A required check that cannot
      # go red is not a gate. The path below is the one phpbench.json declares.
      - name: Detect benchmarks
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          if find benchmarks -type f -name "*.php" -print -quit 2>/dev/null | grep -q .; then
            echo "has_benchmarks=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_benchmarks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PHPBench
        if: steps.detect.outputs.has_benchmarks == 'true'
        run: composer bench

      # Fail-closed: the suite is committed (benchmarks/ContainerBench.php), so
      # "no benchmarks found" means the probe or the tree is broken — not that
      # the gate may be skipped. A silent skip here is exactly how this required
      # check stayed green while measuring nothing.
      - name: No benchmarks found (fail-closed)
        if: steps.detect.outputs.has_benchmarks != 'true'
        run: |
          echo "::error::No PHPBench benchmarks found under benchmarks/ — the benchmark gate cannot be skipped silently."
          exit 1
