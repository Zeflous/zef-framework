name: PHP SAST

# Security-oriented source-code analysis for the PHP code in this repository.
# Scope, pinning, severity policy and the relationship to the other gates are
# documented in docs/security/php-sast.md — read it before changing this file.
#
# This workflow deliberately:
#   * requires no repository secret and no PAT (Semgrep CE runs offline),
#   * uses the `pull_request` trigger only (never the write-context variant),
#   * grants write authority to no job (only security-events: write on this job,
#     which is required solely to publish SARIF into code scanning),
#   * never modifies source code.
#
# The analysis inputs are three things, and all three are reviewable in-tree:
#   1. the pinned upstream ruleset (verified by sha256 before use),
#   2. the ZEF-local rules in `.github/semgrep/rules`. These close a measured false
#      negative of the pinned ruleset: a backslash-qualified `\unlink()` call is not
#      matched by `pattern: unlink(...)`, so four live call sites in `tests/`
#      previously produced no finding at all. `ban-qualified-global-call.yaml`
#      closes the whole class of that miss (nineteen functions were measured to have
#      it) by banning the qualified *writing style* for every function a pinned rule
#      matches by name.
#   3. ONE overlay rule file, `.github/semgrep/overlay/tainted-exec.yaml`, which
#      resolves a duplicated rule id in the pinned ruleset - `tainted-exec` is
#      declared in two files at two different severities - to a single definition.
#      The workflow composes it into a derived copy of the sha256-verified tarball,
#      so the pin stays authoritative; see the overlay step.
# Detection width therefore increased and the id/severity ambiguity was removed;
# no threshold, exclusion or floor was relaxed. See docs/security/php-sast.md
# sections 3 and 7 for the measurements.
#
# NOTE ON CONFIG PATHS: `/php/lang/security` is loaded RECURSIVELY - the pinned tree
# holds 36 rule files under it, 10 of them in `injection/` and 3 in `audit/` - so
# listing `injection/` and `audit/` as extra config paths is redundant. An earlier
# revision of this workflow mounted only `${RUNNER_TEMP}/rules` while asking Semgrep
# for `--config=/rules-overlay/...`, which does not exist inside the container and
# fails the job with exit 7.
#
# CORRECTNESS FAMILY (v2.34.0): all four scan lanes additionally load
# `/rules-overlay/php/lang/correctness` - the bug-detector sibling tree from the
# SAME pinned, sha256-verified tarball, so no new pinning surface is introduced.
# This is matrix row 3 of docs/security/stub-prescan.md: the Semgrep correctness
# family is INCLUDED for the production trees and the tests/ fixture corpus
# alike. Measured before enabling (local runs of the pinned ruleset):
# 0 findings over 652 production targets and 0 over 190 corpus targets, so the
# promotion to blocking ships in the same change with no untriaged population
# - the same sequencing rule this file documents for every earlier promotion,
# satisfied by measurement this time because the population is empty.
#
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  workflow_dispatch:

# Baseline: this workflow only reads the checked-out tree. The sole write grant
# is job-level and scoped to publishing SARIF.
permissions:
  contents: read

concurrency:
  group: php-sast-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned analysis inputs. Every value below is immutable on purpose: a security
  # gate whose ruleset or engine can change without a reviewable commit is not a
  # gate. Upgrades are deliberate pull requests (see docs/security/php-sast.md).
  #
  # Engine: semgrep/semgrep 1.177.0, pinned by registry digest (not by tag).
  SEMGREP_IMAGE: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
  # Human-readable engine version that the digest above corresponds to.
  SEMGREP_VERSION: 1.177.0
  # Ruleset: semgrep/semgrep-rules commit 40b8c63f, plus the sha256 of the tarball
  # for that exact commit, which is verified below before anything is executed.
  RULES_SHA: 40b8c63f75dc7c22c8a77482d73bfb864b146f7e
  RULES_TARBALL_SHA256: b7e483abf001c405a3e908251ff66cb198a26702aff5fe4c5f0c4b2fffec4919

jobs:
  php-sast:
    name: PHP SAST (Semgrep)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fetch and verify the pinned Semgrep ruleset
        # Fail-closed: if the ruleset cannot be fetched, or its bytes are not the
        # ones this workflow was reviewed against, the job stops here rather than
        # producing a silent zero-finding pass.
        run: |
          set -euo pipefail
          tarball="${RUNNER_TEMP}/semgrep-rules.tar.gz"
          curl -sSL --fail --retry 3 --retry-delay 2 \
            -o "${tarball}" \
            "https://codeload.github.com/semgrep/semgrep-rules/tar.gz/${RULES_SHA}"
          echo "${RULES_TARBALL_SHA256}  ${tarball}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/rules"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/rules" --strip-components=1
          test -d "${RUNNER_TEMP}/rules/php/lang/security"
          echo "Ruleset ${RULES_SHA} verified (sha256 matches the pinned digest)."

      - name: Build the rule overlay (reconcile the duplicated tainted-exec id)
        # The pinned ruleset declares the id `tainted-exec` in TWO files at two
        # different severities, both reachable from the single recursive config path
        # `/php/lang/security` this workflow loads:
        #     php/lang/security/tainted-exec.yaml            severity ERROR
        #     php/lang/security/injection/tainted-exec.yaml  severity WARNING
        # Semgrep neither deduplicates a rule id across config paths nor lets a later
        # definition override an earlier one, so the same issue was reported at one
        # severity in one pass and at another severity in the next - measured: a single
        # tainted exec() sink produced one result per copy.
        #
        # The canonical copy (ERROR) is authoritative. The overlay is a derived copy of
        # the sha256-verified tarball (the pinned bytes are never edited) in which the
        # canonical file is replaced by the in-tree union definition and the divergent
        # injection copy is removed, so the id resolves to exactly ONE definition at
        # ERROR. The union matters: the two copies are not supersets of each other, so
        # keeping either alone would NARROW detection (the canonical copy alone adds
        # `pcntl_exec`; the injection copy alone adds the `php://input` source,
        # `expect_popen`, backticks and `escapeshellcmd`).
        run: |
          set -euo pipefail
          overlay="${RUNNER_TEMP}/rules-overlay"
          rm -rf "${overlay}"
          mkdir -p "${overlay}"
          cp -R "${RUNNER_TEMP}/rules/php" "${overlay}/php"
          cp "${PWD}/.github/semgrep/overlay/tainted-exec.yaml" \
             "${overlay}/php/lang/security/tainted-exec.yaml"
          rm -f "${overlay}/php/lang/security/injection/tainted-exec.yaml"
          # Fail-closed, and specific: the id must be declared EXACTLY ONCE across the
          # whole overlay, so neither a leftover divergent copy nor a silent
          # non-application of this step can pass.
          n_ids=$(grep -rl '^- id: tainted-exec$' "${overlay}/php" | wc -l | tr -d ' ')
          test "${n_ids}" = "1" || { echo "expected exactly one tainted-exec definition, found ${n_ids}"; exit 1; }
          test ! -e "${overlay}/php/lang/security/injection/tainted-exec.yaml"
          grep -q '^- id: tainted-exec$' "${overlay}/php/lang/security/tainted-exec.yaml"
          grep -q 'severity: ERROR' "${overlay}/php/lang/security/tainted-exec.yaml"
          test "$(grep -c 'severity: ' "${overlay}/php/lang/security/tainted-exec.yaml")" = "1"
          echo "Overlay ready: tainted-exec declared once, at ERROR, with union patterns."

      - name: Scan production PHP source (blocking)
        # The merge-blocking set is every first-party production tree, not just
        # src/: `modules/`, `plugins/` and `app/` are shipped ZEF code (the
        # Module System and the application bootstrap) and were previously
        # scanned by NO pass in this workflow, so a dangerous pattern there was
        # structurally invisible to the gate. The pinned baseline scan of main
        # found zero findings in src/, so ERROR-level findings block without
        # false-positive friction. No suppression is applied to make this pass.
        #
        # This invocation is deliberately UNCHANGED by the warning-coverage step
        # below: same configs, same --severity ERROR --error. The blocking
        # threshold is not relaxed anywhere in this file.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${RUNNER_TEMP}/rules:/rules:ro" \
            -v "${RUNNER_TEMP}/rules-overlay:/rules-overlay:ro" \
            -v "${RUNNER_TEMP}:/out" \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config=/rules-overlay/php/lang/security \
              --config=/rules-overlay/php/lang/correctness \
              --config=/src/.github/semgrep/rules \
              --metrics=off \
              --disable-version-check \
              --severity ERROR \
              --error \
              --sarif \
              --output=/out/sast-src.sarif \
              /src/src /src/modules /src/plugins /src/app

      - name: Scan production PHP source at WARNING severity (blocking)
        # Closes the severity coverage hole: before this step, src/**/ was evaluated
        # at ERROR severity only, so every WARNING-level rule — including the taint
        # rules whose confidence metadata is MEDIUM CONFIDENCE — was never *looked
        # for* in production code. A zero finding count under ERROR meant "no
        # ERROR-level match", never "no WARNING-level match".
        #
        # BLOCKING since 2026-09-24: --error is passed below, so a WARNING finding in
        # production source now fails this job and blocks the pull request.
        #
        # The promotion was sequenced, not bundled. The pass shipped report-only first
        # (PR #41) so its findings were *visible* without turning an untriaged
        # population into a red gate. It was made blocking only after the three
        # findings it revealed — all php.lang.security.unlink-use, best-effort cleanup
        # of a self-named temp file on a failure path — were triaged and registered as
        # accepted suppressions in docs/security/php-sast.md §7.
        #
        # The gate is green because that population was dispositioned in writing, not
        # because it was ignored: no rule was disabled, no path excluded, no finding
        # left unexamined. The ERROR step above is deliberately UNCHANGED — same
        # configs, same --severity ERROR --error. Nothing was relaxed.
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${RUNNER_TEMP}/rules:/rules:ro" \
            -v "${RUNNER_TEMP}/rules-overlay:/rules-overlay:ro" \
            -v "${RUNNER_TEMP}:/out" \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config=/rules-overlay/php/lang/security \
              --config=/rules-overlay/php/lang/correctness \
              --config=/src/.github/semgrep/rules \
              --metrics=off \
              --disable-version-check \
              --severity WARNING \
              --error \
              --sarif \
              --output=/out/sast-src-warning.sarif \
              /src/src /src/modules /src/plugins /src/app

      - name: Scan tests and tooling PHP (blocking)
        # Analysed on purpose — this code runs with repository credentials on CI and
        # on developer machines, so a dangerous pattern there has real impact.
        #
        # BLOCKING since 2026-09-24: --error is passed below, so a WARNING finding in
        # these trees now fails this job and blocks the pull request.
        #
        # The promotion was sequenced, not bundled: the pass shipped report-only
        # first so its 30 findings were *visible* without turning an untriaged
        # population into a red gate, and --error was added only once every one of
        # them had been triaged and registered as an accepted suppression in
        # docs/security/php-sast.md §7. The gate is green because that population was
        # dispositioned in writing, not because it was ignored: no rule was disabled,
        # no path excluded, no finding left unexamined.
        #
        # The two src/ steps above are deliberately UNCHANGED — same configs, same
        # thresholds. Nothing was relaxed; detection width and blocking width both
        # increased.
        run: |
          set -euo pipefail
          targets=""
          for d in tests scripts tools autoload; do
            if [ -d "${PWD}/${d}" ]; then targets="${targets} /src/${d}"; fi
          done
          if [ -z "${targets}" ]; then
            echo "No tests/scripts/tools PHP directories present; nothing to report."
            : > "${RUNNER_TEMP}/sast-tests.sarif"
            exit 0
          fi
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${RUNNER_TEMP}/rules:/rules:ro" \
            -v "${RUNNER_TEMP}/rules-overlay:/rules-overlay:ro" \
            -v "${RUNNER_TEMP}:/out" \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config=/rules-overlay/php/lang/security \
              --config=/rules-overlay/php/lang/correctness \
              --config=/src/.github/semgrep/rules \
              --metrics=off \
              --disable-version-check \
              --severity WARNING \
              --error \
              --sarif \
              --output=/out/sast-tests.sarif \
              ${targets}

      - name: Scan tests and tooling PHP at ERROR severity (blocking)
        # Closes the last measured coverage hole in this workflow: before this step,
        # the combination "ERROR floor over tests/, scripts/, tools/" was evaluated by
        # NO pass. The tooling pass above floors at WARNING and the two src/ passes
        # cover only production source, so a zero count under the WARNING floor never
        # meant "no ERROR-level match" in these trees — it meant the question was not
        # asked. An ERROR-severity rule whose subject appears only in test or tooling
        # code was therefore structurally invisible to this gate.
        #
        # BLOCKING from the start, unlike the two WARNING-floor promotions above: the
        # population here is not untriaged. Enumerating this exact combination reported
        # exactly four findings, and all four were read, traced to their argument's
        # origin and dispositioned in docs/security/php-sast.md §7.5 *before* this step
        # was added — two exec-use on a command assembled entirely from
        # escapeshellarg()-quoted fragments, two eval-use on a fixture the test authored
        # itself. No rule was disabled, no path excluded and no finding left unexamined;
        # in particular no suppression was written for anything this gate does not
        # evaluate, which would have hidden the finding rather than dispositioned it.
        #
        # The four steps around this one are deliberately UNCHANGED — same configs, same
        # thresholds, same ruleset. Nothing was relaxed: blocking width on this tree
        # increased from zero passes to one.
        run: |
          set -euo pipefail
          targets=""
          for d in tests scripts tools autoload; do
            if [ -d "${PWD}/${d}" ]; then targets="${targets} /src/${d}"; fi
          done
          if [ -z "${targets}" ]; then
            echo "No tests/scripts/tools PHP directories present; nothing to evaluate."
            : > "${RUNNER_TEMP}/sast-tests-error.sarif"
            exit 0
          fi
          docker run --rm \
            -v "${PWD}:/src:ro" \
            -v "${RUNNER_TEMP}/rules:/rules:ro" \
            -v "${RUNNER_TEMP}/rules-overlay:/rules-overlay:ro" \
            -v "${RUNNER_TEMP}:/out" \
            "${SEMGREP_IMAGE}" \
            semgrep scan \
              --config=/rules-overlay/php/lang/security \
              --config=/rules-overlay/php/lang/correctness \
              --config=/src/.github/semgrep/rules \
              --metrics=off \
              --disable-version-check \
              --severity ERROR \
              --error \
              --sarif \
              --output=/out/sast-tests-error.sarif \
              ${targets}

      - name: "Normalize SARIF for publication (issue #61)"
        # Two measured behaviours of the pinned engine (semgrep 1.177.0) made every
        # code-scanning alert this workflow ever published defective:
        #
        # 1. Container-absolute paths. The scans run with the workspace mounted at
        #    /src, and Semgrep writes the target path it was given into every
        #    artifactLocation.uri (/src/src/..., /src/tests/...). Code scanning
        #    resolves uris against the repository root, where /src/... does not
        #    exist: alert links 404, and an alert that cannot be attributed to a
        #    real location can never be recognised as fixed.
        # 2. Suppressed findings are still results. A # nosemgrep marker neutralises
        #    the exit code of --error (that is what keeps the blocking gate green)
        #    but the finding is still written to the SARIF, carrying
        #    suppressions: [{"kind": "inSource"}]. Code scanning does not treat that
        #    field as a disposition: it opens an alert for every such result anyway.
        #    Measured on main @ c938edd, and reproduced locally with the same pinned
        #    inputs: the four categories together uploaded 61 results, all 61
        #    carried an accepted suppression (the entire docs/security/php-sast.md
        #    §7 register), and the alert population was exactly that set - 31 open,
        #    30 dismissed to unblock PR #58 - feeding the code_scanning ruleset
        #    (alerts_threshold: all) a permanent, un-actionable count on every PR.
        #
        # This step rewrites each SARIF into the *.published.sarif copy the upload
        # steps below consume:
        #   * every uri carrying the /src container prefix becomes
        #     repository-relative (value-wide: result locations and run-level
        #     artifacts alike), so a future real finding is navigable, attributable
        #     and auto-closable;
        #   * results with a non-empty suppressions array are dropped, so the
        #     published population is exactly the population the exit-code gate
        #     acts on - undispositioned findings. The suppressed population stays
        #     governed by the inline markers and the §7 register, which remain the
        #     in-tree, line-accurate audit trail.
        #
        # The published copy is a separate file on purpose: if this step fails, the
        # upload steps find no file and publish nothing (best-effort, as before)
        # rather than re-publishing un-normalized paths - the failure mode that
        # created the #61 alert population in the first place. This step is
        # deliberately NOT continue-on-error: a silent failure here would republish
        # the disease invisibly, while a red job is a one-line diagnosis.
        #
        # Nothing about the analysis changes: same configs, same ruleset, same
        # severity floors, same --error blocking. No rule is disabled, no path is
        # excluded, no finding is left unexamined. jq 1.7 is preinstalled on
        # ubuntu-24.04 runners.
        if: always()
        run: |
          set -euo pipefail
          {
            echo "### SARIF publication (issue #61)"
            echo ""
            echo "Each SARIF is rewritten before upload: container-relative \`/src/…\` paths"
            echo "become repository-relative, and results carrying an accepted inline"
            echo "suppression (the docs/security/php-sast.md §7 register) are not re-published"
            echo "as code-scanning alerts. Published alerts map to real files and reflect"
            echo "exactly the undispositioned population."
            echo ""
          } >> "${GITHUB_STEP_SUMMARY}"
          for f in sast-src sast-src-warning sast-tests sast-tests-error; do
            sarif="${RUNNER_TEMP}/${f}.sarif"
            published="${RUNNER_TEMP}/${f}.published.sarif"
            rm -f "${published}"
            if [ ! -s "${sarif}" ]; then
              echo "'${f}.sarif' absent or empty; nothing to publish."
              echo "- ${f}: not produced by this run" >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi
            scanned=$(jq '[.runs[]?.results[]?] | length' "${sarif}")
            jq '
              def strip_container_prefix:
                if type == "object" and ((.uri | type) == "string") and (.uri | startswith("/src/"))
                then .uri |= sub("^/src/"; "")
                else .
                end;
              walk(strip_container_prefix)
              | if (.runs | type) == "array" then
                  .runs |= map(
                    if (.results | type) == "array"
                    then .results |= map(select((.suppressions // []) | length == 0))
                    else . end)
                else . end
            ' "${sarif}" > "${published}"
            kept=$(jq '[.runs[]?.results[]?] | length' "${published}")
            echo "- ${f}: ${scanned} scanned -> ${kept} published ($((scanned - kept)) suppressed, registered in docs §7)" >> "${GITHUB_STEP_SUMMARY}"
            echo "${f}: ${scanned} result(s) scanned -> ${kept} published"
          done

      - name: Upload SARIF (production source)
        # Best-effort publication only. The blocking decision is made by the exit
        # code of the scan above, never by code scanning being available. The file
        # uploaded here is the normalized copy produced by the preceding step.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sast-src.published.sarif
          category: php-sast-source

      - name: Upload SARIF (production source, WARNING severity)
        # Published under its own category so the lower-floor production findings are
        # never mixed with the ERROR-floor ones in code scanning. Both categories are
        # blocking since 2026-09-24; they stay separate so a reviewer can still tell
        # which severity floor produced a given alert. Uploaded here is the
        # normalized copy produced by the normalization step. Best-effort, like
        # every upload here: publication is not the gate.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sast-src-warning.published.sarif
          category: php-sast-source-warning

      - name: Upload SARIF (tests and tooling)
        # Uploaded here is the normalized copy produced by the normalization step.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sast-tests.published.sarif
          category: php-sast-tests

      - name: Upload SARIF (tests and tooling, ERROR severity)
        # Uploaded here is the normalized copy produced by the normalization step.
        # Own category again, so a reviewer can still tell which severity floor over
        # these trees produced an alert. Best-effort, like every upload here:
        # publication is never the gate.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: ${{ runner.temp }}/sast-tests-error.published.sarif
          category: php-sast-tests-error

      - name: Job summary
        if: always()
        # Informational only. This step must never decide the outcome of the gate, so
        # it explicitly cannot fail the job: an auxiliary command returning non-zero
        # on a zero-finding SARIF would otherwise turn a clean analysis red.
        continue-on-error: true
        run: |
          set -uo pipefail
          count_matches() {
            # Semgrep emits valid SARIF with an empty results array when a scan finds
            # nothing, so a no-match grep is the expected case, not an error.
            local n
            n=$(grep -o '"ruleId"' "$1" 2>/dev/null | wc -l | tr -d ' ') || n=0
            printf '%s' "${n:-0}"
          }
          {
            echo "### PHP SAST (Semgrep)"
            echo ""
            echo "- engine: semgrep ${SEMGREP_VERSION} (image pinned by digest)"
            echo "- engine digest: \`${SEMGREP_IMAGE##*@}\`"
            echo "- ruleset commit: \`${RULES_SHA}\`"
            echo "- ZEF-local rules: \`.github/semgrep/rules\` (additive; closes the qualified-call false negative)"
            echo "- production source, ERROR severity: blocking"
            echo "- production source, WARNING severity: blocking (promoted 2026-09-24)"
            echo "- tests and tooling, WARNING severity: blocking (promoted 2026-09-24)"
            echo "- tests and tooling, ERROR severity: blocking (coverage hole closed 2026-09-24)"
            for pair in \
              "sast-src.sarif=production, ERROR severity (blocking)" \
              "sast-src-warning.sarif=production, WARNING severity (blocking)" \
              "sast-tests.sarif=tests and tooling, WARNING severity (blocking)" \
              "sast-tests-error.sarif=tests and tooling, ERROR severity (blocking)"; do
              f="${RUNNER_TEMP}/${pair%%=*}"
              label="${pair##*=}"
              if [ -s "${f}" ]; then
                n=$(count_matches "${f}")
              else
                n="n/a"
              fi
              echo "- ${label}: ${n} finding(s)"
            done
            echo ""
            echo "Counts above are scan findings (pre-publication). The SARIF publication"
            echo "step rewrites each file before upload: container-relative paths become"
            echo "repository-relative and accepted inline suppressions (docs §7 register)"
            echo "are not re-published as alerts - see the SARIF publication (issue #61)"
            echo "section and docs/security/php-sast.md §3 and §9."
            echo ""
            echo "Findings are published to code scanning under the categories"
            echo "\`php-sast-source\`, \`php-sast-source-warning\`, \`php-sast-tests\` and"
            echo "\`php-sast-tests-error\`."
            echo "See docs/security/php-sast.md."
          } >> "${GITHUB_STEP_SUMMARY}"