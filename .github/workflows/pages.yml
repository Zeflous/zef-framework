name: Documentation & GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Pull requests are validated by the dedicated "API Documentation Check"
# workflow (docs-check.yml), which builds the docs read-only without the
# deploy job - so no job in this workflow is ever skipped on its triggers.

# Baseline: read-only by default; write authority is scoped to the deploy job below.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # NOT "Build API documentation": that exact name is the required status
    # check context owned by docs-check.yml (the pull-request half of this
    # pipeline). Two workflows publishing the same check name made the
    # required context ambiguous — a reviewer could not tell which run the
    # branch protection was actually gating on. This job is the deploy half
    # and is not a required context, so it takes a distinct name.
    name: Build documentation site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: "8.4"
          tools: composer

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate API documentation (Doctum)
        run: composer docs

      # Official documentation: curated Markdown under docs/ plus the root
      # README, rendered to static HTML by scripts/build_docs.php. The Doctum
      # API reference is merged under build/docs/api so both surfaces are
      # served from one Pages root (previously Pages served build/api alone).
      - name: Build official documentation site
        run: |
          set -euo pipefail
          php scripts/build_docs.php
          mkdir -p build/docs/api
          cp -R build/api/. build/docs/api/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/docs

  deploy:
    name: Deploy API documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
