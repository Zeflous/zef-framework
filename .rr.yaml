# Konfigurasi RoadRunner v2025.1 untuk ZEF Framework.
# Jalankan:  vendor/bin/rr serve -c .rr.yaml
# Worker:    bin/worker.php (bridge spiral/roadrunner-http + nyholm/psr7 sudah di vendor/)

version: "2025.1"

server:
  command: "php bin/worker.php"
  relay: "pipes"

http:
  # Alamat publik server RoadRunner.
  address: 0.0.0.0:8080
  # Middleware bawaan RR; tambahkan "static" bila ingin melayani public/ langsung.
  middleware: [ "gzip" ]
  pool:
    # Jumlah worker PHP; kalibrasi sesuai CPU.
    num_workers: 4
    # Batas jumlah request per worker sebelum didaur ulang. `0` = tanpa batas,
    # yang berarti kebocoran memori (atau state yang tidak sengaja tertahan di
    # proses persistent-worker) menumpuk sampai worker mati sendiri. Nilai
    # terbatas membuat daur ulang terjadi secara deterministik.
    max_jobs: 500
    supervisor:
      max_worker_memory: 512   # MB per worker (0 = nonaktif)

logs:
  # Mode produksi: log terstruktur (JSON) untuk agregasi, bukan console
  # berwarna yang ditujukan untuk terminal pengembang.
  mode: production
  level: info
  encoding: json
