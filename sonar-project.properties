# and the step (therefore the job) fails when the gate is red.
sonar.qualitygate.wait=true

# Coverage REPORT PATH is deliberately NOT configured in this file (v2,
# 2026-09-28): the clover report only exists when the CI lane's
# "coverage-clover" artifact for this exact commit could be fetched, so the
# scanner arguments are computed per run by the workflow -
# sonar.php.coverage.reportPaths=build/clover.xml when the bridge succeeded,
# sonar.coverage.exclusions=**/* for that single run when it could not (always
# announced, never silent). The STATIC sonar.coverage.exclusions above is a
# different thing: the permanent, in-tree list of analysed-but-not-instrumented
# trees. See docs/security/sonarcloud.md section 6.
