# OVERALL-GATE ROUND (2026-09-29, post-#256-merge main analysis: 76 findings).
# The PR #256 campaign cleared every NEW-code finding, but the strict gate
# also scores the WHOLE codebase on the main branch, surfacing pre-existing
# findings on lines the campaign never touched. That remainder is
# dispositioned here with the same discipline — fixed in code where the fix
# is behaviour-preserving (S103/S2005/S6353/S881/S112/S1121/S1142/S1192/
# S126/S3358/S3776/S1541/S1067 all landed as refactors), suppressed below
# only where the "fix" would change documented behaviour or break BC.
#
# DOCUMENTED BY-DESIGN BEHAVIOUR (same triage as the S1523/S2043/S2003
# criteria above — the inline docblock/comment at each site is the contract):
#   * S2002 on Env — deprecateFacade() suppresses the E_USER_DEPRECATED
#     notice on purpose (Symfony-style deprecation contract: custom error
#     handlers still observe it, PHPUnit/self-test runs stay quiet; the
#     docblock above the call pins the reasoning).
#   * S2003 on AutowireAotCompiler — loadDefinitions() re-reads a
#     side-effect-free `<?php return [...];` data artifact; require_once
#     would hand back true on the second in-process load and break the
#     array contract. Third instance of the RouteCache/PhpFileConfigSource
#     include envelope triage above.
#   * S2047 on SnapshotStoreInterface — delete() returns "true when a
#     snapshot existed and was removed": an outcome report, not a state
#     predicate. Renaming a public interface method to satisfies*() is a
#     BC break for every implementor and caller in the ecosystem.
#   * S2830 on RotatingKeyRing — the constructor materialises one
#     AesGcmEncryptor per key up front precisely so invalid key material
#     fails at construction ("Validate every key up front by materialising
#     each encryptor once", per the inline comment); injecting pre-built
#     encryptors would move that failure to first use and weaken the
#     fail-fast contract.
#
# TOOL-CONFLICT DISPOSITION (the local style gate wins, same family as the
# s1105/s1106/s139/s1578/s1808 criteria):
#   * S103 on Psr17Factory — the php-cs-fixer class_definition rule
#     (PER-CS2.0/@Symfony) pins the implements list to a single line; the
#     191-char line is the price of declaring all six PSR-17 factory
#     interfaces on one adapter. Splitting the list is reverted by the
#     fixer on the next `composer format` run.
#
# API-SHAPE FLOORS (public signatures; the parameter count IS the contract):
#   * S107 on RequestFactory::fromServer() — the eight explicit arguments
#     ARE the injectable ingress surface documented in the P-12 fix
#     (issue #171): every SAPI source array passed explicitly so
#     fromServer() never consults process-global state. An options DTO
#     would be a BC break for every caller.
#   * S107 on SigV4::authorization() — the nine parameters mirror the AWS
#     SigV4 canonical-request component list one-for-one (method, path,
#     query, headers, payload hash, key id, secret, region, amz-date); the
#     signature is the spec.
#   * S1172 on RouteConstraintValidator::test() — $param is unused by the
#     implementation but part of the published 3-argument call contract
#     (param name, constraint type, value) exercised by callers; dropping
#     it is a BC break, and it keeps the slot for per-parameter error
#     context.
#
# CLASS-SIZE/VOCABULARY FLOORS (same triage as s1448/s2042-querybuilder and
# s1200-routemetadataaccumulator — splitting is BC surgery without a
# behaviour win):
#   * S1200/S2042 on RequestFactory — the single documented ingress adapter
#     (fromGlobals/fromServer/validateIngress) whose 24 collaborators are
#     the PSR-7 message vocabulary it assembles; the complexity hot spots
#     were already decomposed into resolve*/parse*/assert* helpers.
#   * S1200/S1448/S2042 on Container — the PSR-11 container surface itself;
#     34 methods over 216 lines, with a registry/registrar split already
#     extracted where cohesive.
#   * S1448 on Application — the kernel facade's 28 methods are the
#     composed boot lifecycle it exists to expose.
#   * S1820 on OpenApi Attribute\Property (22) and Schema (30) — the field
#     count equals the OpenAPI 3.1 property/schema vocabulary those value
#     objects exist to mirror, one field per spec member.
#
# ASCII-BY-DESIGN REGEX GRAMMARS (php:S5867, second batch — the same
# disposition as the 11 first-batch files: making these Unicode-aware would
# ACCEPT input the grammar must reject; the explicit ASCII class IS the
# specification):
#   * Wire/identifier grammars, one file per domain: HTTP method tokens
#     (HttpMethodValidator, RFC 9110 tchar; RateLimitRule — uppercase
#     ASCII method tokens, see the inline php:S5867 note there), Bearer
#     scheme (AuthenticationMiddleware, RFC 6750), HTTP status line
#     (OtlpHttpJsonExporter — ASCII wire format), Base32 body and padding
#     (Base32, RFC 4648).
#   * Identifier-ish keys that must stay ASCII for portability across
