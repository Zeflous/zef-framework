# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.

# The projectKey and organization MUST match the values shown in SonarCloud
# (Project Administration > Project Key, and the organization key in the URL).
# These are the live, verified values (org-mode migration 2026-09-28: the
# repository was transferred to the GitHub organization Zeflous, so the
# analysis targets the org-bound SonarCloud organization "zeflous" and its
# project zeflous_zef-framework — a SonarCloud organization can only
# decorate pull-request comments of GitHub repos owned by the account/org it
# is bound to, and the SONAR_TOKEN repository secret was rotated to an
# org-key identity of that organization in the same change). The earlier
# personal-mode project mbetixz_zef-framework (organization "mbetixz", first
# credentialed analysis 2026-09-27, quality-gate decoration confirmed on
# PR #207) is no longer referenced and should be deleted — see
# docs/security/sonarcloud.md section 3, step 6.
sonar.projectKey=zeflous_zef-framework
sonar.organization=zeflous

sonar.sourceEncoding=UTF-8

# PYTHON TOOLING VERSION (2026-09-30). The six scripts/**/*.py tools run as
# `python3` on the pinned ubuntu-24.04 runner, whose image ships Python 3.12.3
# (actions/runner-images Ubuntu2404-Readme.md). Declaring it explicitly keeps
# the analysis precise and silences the "compatible with Python 3.10 through
# 3.14 by default" notice. Bump this when the runner image's python3 moves.
sonar.python.version=3.12

# ANALYSIS SCOPE (v5, 2026-09-29 - first-party code only, fail-closed).
#
# The analysed surface is the code ZEF OWNS: src/ (the framework product) plus
# the first-party trees that ship with it and run with operator/CI privileges -
# app/ (demo application), modules/ and plugins/ (demo extension points),
# bin/ (CLI + RoadRunner entrypoints), scripts/ (CI/dev tooling) and autoload/
# (the generated, shipped classmap). Everything else stays out.
#
# WHY THE SCOPE IS EXPLICIT AND FAIL-CLOSED. A glob is fail-open: any file that
# appears under a globbed tree later is analysed (or excluded) without anyone
# deciding. That is exactly the failure mode this file now avoids for bin/:
# bin/rr is a ~62 MB RoadRunner release binary DOWNLOADED into bin/ (see
# .gitignore and .gitattributes, which mark it `binary export-ignore`), and a
# `bin/**` pattern would silently pull third-party artefacts into the analysis.
# bin/ is therefore enumerated file-by-file (bin/zef,bin/worker.php) - a new
# bin/ file requires an explicit decision to enter the scope. The same
# reasoning is why **/modules/** and **/plugins/** were dropped: they would
# have swallowed a future src/Modules/ or src/Plugins/ without a decision.
#
# WHY COVERAGE IS EXCLUDED FOR THESE TREES (sonar.coverage.exclusions below).
# phpunit.xml.dist instruments src, modules and plugins only. app/, bin/,
# scripts/ and autoload/ are NOT instrumented, so if they entered the coverage
# denominator they would count as 100% uncovered and collapse overall coverage
# from 97.0% to ~74.5% - a measurement artefact, not a real regression. They
# are analysed for ISSUES (bugs, vulnerabilities, code smells, duplications)
# but excluded from COVERAGE. modules/ and plugins/ are instrumented but are
# demo code outside the product's coverage promise, so they are excluded from
# coverage too (this also keeps the clover report's 14 out-of-scope paths from
# emitting the sonar-php "Failed to resolve N file path(s)" WARN).
#
# tests/ stays OUT of the analysis entirely (v4 decision, unchanged): the new
# scope UX has no sonar.tests equivalent, so test files would land in the
# coverage denominator with zero data (measured: overall coverage collapsed to
# 33.6% vs 97.0% real src coverage) and every test-file issue would count
# toward the reliability rating (976 bugs, 16 BLOCKER-class exit()/loose-
# function fixtures; ratings E/D -> first main scan FAILED its gate, 2026-09-28
# 16:10 UTC). Test-code quality is owned by strictly stronger in-repo gates -
# the mutation zone ratchet (composer mutation:zones, per-zone floors +
# aggregate MSI 85 / covered 90 enforced on release tags), PHPStan level max
# with strict rules over tests too, and PHPUnit's failOnRisky/strict policies.
#
# v3 background (still true, kept for the record): the new UX ignores
# sonar.sources/sonar.tests and analyses the whole project by default -
# measured on the org-mode project's second scan (PR #227, 2026-09-28
# 15:19 UTC), 883 files were indexed with the scanner warning "The following
# properties are configured but have no effect: sonar.sources, sonar.tests."
# The exclusion property is sonar.exclusions (PLURAL): the earlier singular
# "sonar.exclusion" line was a silent no-op.
#
# If the analysis scope is ever widened to include an excluded tree, drop its
# pattern FIRST: sonar.exclusions keeps those files out of the analysis
# entirely. The unresolved-path warning stays useful as a tripwire for paths
# outside the declared scope. This is NOT a sonar.projectBaseDir problem: the
# scan action passes -Dsonar.projectBaseDir=. and the log shows the base dir
# matching the clover paths - a wrong base dir would fail to resolve every
# file in the report, not exactly the out-of-scope ones.
sonar.exclusions=tests/**,assets/**,benchmarks/**,deploy/**,docs/**,public/**,.github/**,.githooks/**,LICENSE,README.md,SECURITY.md,composer.json,composer.lock,deptrac.yaml,doctum.php,inf-openapi-a.json5,inf-openapi-b.json5,inf-openapi-rules.json5,infection-chunk-f7-apprest-baseline.json5,infection-chunk-f7-rest-c.json5,infection-chunk-f7-rest-c3.json5,infection-fullrun.json5,infection.json5,phpbench.json,phpcs.xml.dist,phpstan-baseline.limit,phpstan-baseline.neon,phpstan.neon.dist,phpunit.xml.dist,rector.php,sonar-project.properties,.gitattributes,.gitignore,.php-cs-fixer.dist.php,.rr.yaml,.semgrepignore

# COVERAGE EXCLUSIONS (v5, 2026-09-29). These trees are ANALYSED for issues
# but kept out of the coverage denominator, because phpunit.xml.dist does not
# instrument them (app/, bin/, scripts/, autoload/) or because they are demo
# code outside the product's coverage promise (modules/, plugins/). bin/ is
# enumerated file-by-file on purpose - see the scope note above; do NOT
# "tidy" it back into bin/**.
sonar.coverage.exclusions=app/**,**/modules/**,**/plugins/**,bin/zef,bin/worker.php,scripts/**,autoload/**

# DUPLICATION EXCLUSIONS (2026-09-29, PR #251 round 2). The new-code
# duplication condition (3%) read 3.9% on the widened v5 scope — 1046
# duplicated new lines, of which 848 are autoload/zef_autoload.php: a
# GENERATED classmap whose repetition IS the artifact's format (one
# `'Class' => __DIR__ . '/path.php',` line per shipped class, ~1100
# classes). It cannot be "deduplicated" any more than a CSV's commas can,
# and it already carries the S103/S104/S100/S138/S1192/S2007/S2036 issue
# suppressions above for exactly that reason. sonar.cpd.exclusions removes
# ONLY the copy-paste detector from that tree — issue analysis of
# autoload/** stays fail-closed on, and the file still counts toward
# new_lines. The remaining ~198 duplicated new lines are hand-written code
# and stay VISIBLE by design; their dispositions (the demo app/ tree's
# parallel copies of the src/-resident composition root + middleware — the
# bin/zef demo surface; per-script fail-closed boilerplate; per-tool
# containment validators) are recorded in docs/security/sonarcloud.md
# section 4, scope v5.
sonar.cpd.exclusions=autoload/**


# ISSUE SUPPRESSIONS (2026-09-29). Two src/ files use eval() BY DESIGN and
# are the only two php:S1523 (dynamic code execution) findings the src-only
# scope still surfaces; suppressing them keeps the security rating honest
# (A = no unsuppressed vulnerability) instead of permanently red on
# deliberate, documented features:
#   * src/Adapters/Runtime/TinkerSession.php — a REPL: evaluating
#     developer-supplied code IS the feature (local dev tool; input is
#     never remote/untrusted; see the inline nosemgrep note at the call).
#   * src/Application/Container/Autowiring/AutowireAotCompiler.php —
#     evalFactory() evaluates factory code this compiler generated itself
#     at compile time (the Symfony DI container-dump pattern; also carries
#     an inline nosemgrep note).
# Both sites are already annotated for the Semgrep lane with the same
# rationale; these criteria make the SonarCloud lane agree with that
# triage instead of re-litigating it every scan. Scope note: the
# multicriteria resourceKey is a single ANT-style pattern per criterion,
# hence two entries rather than a comma list.
sonar.issue.ignore.multicriteria=s1523-tinker,s5867-scripts,s103-scripts,s103-autoload,s104-autoload,s100-autoload,s138-autoload,s1192-autoload,s2007-autoload,s2007-scripts,s2007-bin,s1799-scripts,s1799-bin,s2036-autoload,s2036-scripts,s5867-errorresponsefactory,s5843-errorresponsefactory,s5869-errorresponsefactory,s2002-globalerrorhandler,s1172-smoke,s1996-smoke,s112-smoke,s1523-aot,s1105-braces,s1106-braces,s139-trailing,s1578-filename,s1808-forspace,s2043-superglobals,s2003-routecache,s2003-compiledconfigsource,s5867-jobenvelope,s5867-messagecatalog,s5867-configaggregator,s5867-envconfigsource,s5867-moduleregistry,s5867-aesgcm,s5867-querybuilder,s5867-headervalidator,s5713-limitedinputstream,s2037-ratelimitalgorithm,s2043-envconfigsource,s1448-querybuilder,s2042-querybuilder,s1155-rotatingkeyring,s2003-phpfileconfigsource,s5867-routepatternparser,s5867-urlgenerator,s5867-postmancollectionexporter,s5867-routepathparameterfactory,s5867-healthaggregator,s5867-telemetrysanitizer,s5867-csrftokenmanager,s5867-configurationgovernance,s5867-securitypolicy,s5867-routeconstraintvalidator,s5867-prometheusrenderer,s1200-routemetadataaccumulator,s2002-env,s2003-aotcompiler,s103-psr17factory,s107-requestfactory,s107-sigv4,s1172-routeconstraintvalidator,s1200-requestfactory,s1200-container,s1448-container,s1448-application,s2042-requestfactory,s2042-container,s1820-property,s1820-schema,s2047-snapshotstoreinterface,s2830-rotatingkeyring,s5867-problemdetails,s5867-authenticationmiddleware,s5867-securityruntimemiddleware,s5867-taggedservicelocator,s5867-routespecextractor,s5867-value,s5867-messageenvelope,s5867-correlationcontext,s5867-operation,s5867-routedefinition,s5867-base32,s5867-ratelimitrule,s5867-httpmethodvalidator,s5867-defaultcachekeynormalizer,s5867-taggablecache,s5867-environmentsecretprovider,s5867-secretprovideradapter,s5867-namingrules,s5867-otlphttpjsonexporter,s5867-globalerrorhandler,s5867-hostpatternmatches,s1448-router
