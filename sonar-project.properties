# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.

# The projectKey and organization MUST match the values shown in SonarCloud
# (Project Administration > Project Key, and the organization key in the URL).
# These are the live, verified values (org-mode migration 2026-09-28: the
# repository was transferred to the GitHub organization Zeflous, so the
# analysis targets the org-bound SonarCloud organization "zeflous" and its
# project zeflous_zef-framework — a SonarCloud organization can only
# decorate pull-request comments of GitHub repos owned by the account/org it
# is bound to, and the SONAR_TOKEN repository secret was rotated to an
# org-key identity of that organization in the same change). The earlier
# personal-mode project mbetixz_zef-framework (organization "mbetixz", first
# credentialed analysis 2026-09-27, quality-gate decoration confirmed on
# PR #207) is no longer referenced and should be deleted — see
# docs/security/sonarcloud.md section 3, step 6.
sonar.projectKey=zeflous_zef-framework
sonar.organization=zeflous

sonar.sourceEncoding=UTF-8

# ANALYSIS SCOPE (v3, 2026-09-28 — re-scoped for SonarCloud's new
# analysis-scope UX). The new UX ignores sonar.sources/sonar.tests and
# analyses the whole project by default: measured on the org-mode project's
# second scan (PR #227, 2026-09-28 15:19 UTC), 883 files were indexed —
# every tracked file in the repository — versus 680 under the previous
# src/+tests/ scope, with the scanner warning "The following properties are
# configured but have no effect: sonar.sources, sonar.tests." The scope
# decision therefore lives entirely in sonar.exclusions below: everything
# outside src/ and tests/ is excluded — the demo application code
# (modules/, plugins/, app/), tooling (scripts/, bin/, benchmarks/,
# autoload/), deployment (deploy/, public/), documentation (docs/), assets,
# repository meta (.github/, .githooks/) and the root-level configuration
# files. The analysed surface remains exactly src/ + tests/ (505 + 175 =
# 680 files — parity with the pre-UX scope).
#
# Property-name note: the exclusion property is sonar.exclusions (PLURAL).
# The earlier singular "sonar.exclusion" line was a silent no-op, proven by
# that same scan indexing modules/ and plugins/ despite the pattern; it only
# appeared to work before because sonar.sources=src already kept those
# directories out of the analysis.
#
# modules/ and plugins/ additionally appear in the CI lane's clover report
# (phpunit.xml.dist instruments src, modules and plugins, and the 90%
# coverage gate asserts on all three), so bridged scans meet report entries
# that resolve to no analysed file, which sonar-php reports as the WARN
# "Failed to resolve 14 file path(s) in PHPUnit coverage clover.xml
# report..." — these exclusions also filter those unresolved report paths
# (sonar-php's AbstractReportImporter), keeping the expected warning quiet.
# If the analysis scope is ever widened to include an excluded tree, drop
# its pattern FIRST: sonar.exclusions keeps those files out of the analysis
# entirely. The unresolved-path warning stays useful as a tripwire for
# paths outside the declared scope. This is NOT a sonar.projectBaseDir
# problem: the scan action passes -Dsonar.projectBaseDir=. and the log
# shows the base dir matching the clover paths — a wrong base dir would
# fail to resolve every file in the report, not exactly the out-of-scope
# ones.
sonar.exclusions=**/modules/**,**/plugins/**,app/**,assets/**,autoload/**,benchmarks/**,bin/**,deploy/**,docs/**,public/**,scripts/**,.github/**,.githooks/**,LICENSE,README.md,SECURITY.md,composer.json,composer.lock,deptrac.yaml,doctum.php,inf-openapi-a.json5,inf-openapi-b.json5,inf-openapi-rules.json5,infection-chunk-f7-apprest-baseline.json5,infection-chunk-f7-rest-c.json5,infection-chunk-f7-rest-c3.json5,infection-fullrun.json5,infection.json5,phpbench.json,phpcs.xml.dist,phpstan-baseline.limit,phpstan-baseline.neon,phpstan.neon.dist,phpunit.xml.dist,rector.php,sonar-project.properties,.gitattributes,.gitignore,.php-cs-fixer.dist.php,.rr.yaml,.semgrepignore

# The quality gate is blocking: the scanner waits for the server-side verdict
# and the step (therefore the job) fails when the gate is red.
sonar.qualitygate.wait=true

# Coverage is deliberately NOT configured in this file (v2, 2026-09-28): the
# clover report only exists when the CI lane's "coverage-clover" artifact for
# this exact commit could be fetched, so the scanner arguments are computed
# per run by the workflow — sonar.php.coverage.reportPaths=build/clover.xml
# when the bridge succeeded, sonar.coverage.exclusions=**/* for that single
# run when it could not (always announced, never silent). See
# docs/security/sonarcloud.md section 6.
