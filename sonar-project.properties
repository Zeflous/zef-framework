# ROUTER FEATURE-EXPANSION (2026-10-02, PR #354). Same two dispositions as
# the rounds above, applied to the subdomain-routing primitives:
#   * S5867 on HostPatternMatches — the `{name}` wildcard label grammar is an
#     ASCII DNS-label contract: a host label is ASCII by definition, so making
#     the pattern Unicode-aware would ACCEPT hosts the grammar must reject.
#     The pattern already carries the `u` flag over UTF-8-scrubbed input; only
#     the label charset is ASCII (exactly the RoutePatternParser/RouteConstraint
#     validator-family triage). With this explicit suppression the pattern is
#     written ONCE (the `u` modifier applied to a single shared constant)
#     instead of being duplicated for a cosmetic rule.
#   * S1448 on Router — the reverse-routing / host-aware / cache-serialization
#     surface added by this campaign; Router::exportRoutes() /
#     fromCompiledArray() MUST stay on Router because RouteCache calls them
#     there (moving them is a BC break for the compiled-cache contract), and
#     the surface already delegates to RouteMatcher/RouteCollection/
#     RouteGroupStack helpers — same class-size-floor triage as s1448-container.
