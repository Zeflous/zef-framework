# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.

# The projectKey and organization MUST match the values shown in SonarCloud
# (Project Administration > Project Key, and the organization key in the URL).
# These are the live, verified values (org-mode migration 2026-09-28: the
# repository was transferred to the GitHub organization Zeflous, so the
# analysis targets the org-bound SonarCloud organization "zeflous" and its
# project zeflous_zef-framework — a SonarCloud organization can only
# decorate pull-request comments of GitHub repos owned by the account/org it
# is bound to, and the SONAR_TOKEN repository secret was rotated to an
# org-key identity of that organization in the same change). The earlier
# personal-mode project mbetixz_zef-framework (organization "mbetixz", first
# credentialed analysis 2026-09-27, quality-gate decoration confirmed on
# PR #207) is no longer referenced and should be deleted — see
# docs/security/sonarcloud.md section 3, step 6.
sonar.projectKey=zeflous_zef-framework
sonar.organization=zeflous

sonar.sourceEncoding=UTF-8

# ANALYSIS SCOPE (v4, 2026-09-29 — tests/ moves OUT of the analysis).
# v3 kept parity with the pre-UX scope (src/ + tests/, 680 files), and the
# first main-branch analysis of the fresh org-mode project then measured
# what that parity costs under a young new-code window: with tests/ inside
# the scope, the tests are analysed as PRODUCTION code — the new scope UX
# has no sonar.tests equivalent, so test files landed in the coverage
# denominator with zero data (clover instruments src+modules+plugins only;
# measured: overall coverage collapsed to 33.6% vs 97.0% real src coverage)
# and every test-file issue counted toward the reliability rating (976
# bugs, 16 of them BLOCKER-class exit()/loose-function fixtures; ratings E/D
# → first main scan FAILED its gate, 2026-09-28 16:10 UTC). Worse, the same
# arithmetic would re-run on EVERY pull request that adds tests: the new
# test lines are new code, their S5783/S2007 findings are new-code issues,
# and the gate would fail every test-writing PR from then on.
#
# The v4 decision: SonarCloud reviews the PRODUCT code (src/). Test-code
# quality is owned by strictly stronger in-repo gates — the mutation zone
# ratchet (composer mutation:zones, per-zone floors + aggregate MSI 85 /
# covered 90 enforced on release tags), PHPStan level max with strict rules
# over tests too, and PHPUnit's failOnRisky/strict policies. Sonar's
# test-style rules (S5783 try-shape, S2007 fixtures outside classes) add no
# signal those gates do not already dominate.
#
# Everything outside src/ is therefore excluded — the demo application
# code (modules/, plugins/, app/), tooling (scripts/, bin/, benchmarks/,
# autoload/), deployment (deploy/, public/), documentation (docs/), assets,
# repository meta (.github/, .githooks/), the root-level configuration
# files, and now tests/ as well. The analysed surface is exactly src/
# (505 files).
#
# v3 background (still true, kept for the record): the new UX ignores
# sonar.sources/sonar.tests and analyses the whole project by default —
# measured on the org-mode project's second scan (PR #227, 2026-09-28
# 15:19 UTC), 883 files were indexed with the scanner warning "The following
# properties are configured but have no effect: sonar.sources,
# sonar.tests." The exclusion property is sonar.exclusions (PLURAL): the
# earlier singular "sonar.exclusion" line was a silent no-op.
#
# modules/ and plugins/ additionally appear in the CI lane's clover report
# (phpunit.xml.dist instruments src, modules and plugins, and the 90%
# coverage gate asserts on all three), so bridged scans meet report entries
# that resolve to no analysed file, which sonar-php reports as the WARN
# "Failed to resolve 14 file path(s) in PHPUnit coverage clover.xml
# report..." — these exclusions also filter those unresolved report paths
# (sonar-php's AbstractReportImporter), keeping the expected warning quiet.
# tests/ never appears in the clover at all (the PHPUnit source filter
# instruments src+modules+plugins only), so it produces no such WARN — it
# is excluded from the ANALYSIS itself, which is what keeps its zero-data
# files out of the coverage denominator. If the analysis scope is ever
# widened to include an excluded tree, drop its pattern FIRST:
# sonar.exclusions keeps those files out of
# the analysis entirely. The unresolved-path warning stays useful as a
# tripwire for paths outside the declared scope. This is NOT a
# sonar.projectBaseDir problem: the scan action passes
# -Dsonar.projectBaseDir=. and the log shows the base dir matching the
# clover paths — a wrong base dir would fail to resolve every file in the
# report, not exactly the out-of-scope ones.
sonar.exclusions=**/modules/**,**/plugins/**,tests/**,app/**,assets/**,autoload/**,benchmarks/**,bin/**,deploy/**,docs/**,public/**,scripts/**,.github/**,.githooks/**,LICENSE,README.md,SECURITY.md,composer.json,composer.lock,deptrac.yaml,doctum.php,inf-openapi-a.json5,inf-openapi-b.json5,inf-openapi-rules.json5,infection-chunk-f7-apprest-baseline.json5,infection-chunk-f7-rest-c.json5,infection-chunk-f7-rest-c3.json5,infection-fullrun.json5,infection.json5,phpbench.json,phpcs.xml.dist,phpstan-baseline.limit,phpstan-baseline.neon,phpstan.neon.dist,phpunit.xml.dist,rector.php,sonar-project.properties,.gitattributes,.gitignore,.php-cs-fixer.dist.php,.rr.yaml,.semgrepignore

# ISSUE SUPPRESSIONS (2026-09-29). Two src/ files use eval() BY DESIGN and
# are the only two php:S1523 (dynamic code execution) findings the src-only
# scope still surfaces; suppressing them keeps the security rating honest
# (A = no unsuppressed vulnerability) instead of permanently red on
# deliberate, documented features:
#   * src/Adapters/Runtime/TinkerSession.php — a REPL: evaluating
#     developer-supplied code IS the feature (local dev tool; input is
#     never remote/untrusted; see the inline nosemgrep note at the call).
#   * src/Application/Container/Autowiring/AutowireAotCompiler.php —
#     evalFactory() evaluates factory code this compiler generated itself
#     at compile time (the Symfony DI container-dump pattern; also carries
#     an inline nosemgrep note).
# Both sites are already annotated for the Semgrep lane with the same
# rationale; these criteria make the SonarCloud lane agree with that
# triage instead of re-litigating it every scan. Scope note: the
# multicriteria resourceKey is a single ANT-style pattern per criterion,
# hence two entries rather than a comma list.
sonar.issue.ignore.multicriteria=s1523-tinker,s1523-aot,s1105-braces,s1106-braces,s139-trailing,s1578-filename,s1808-forspace,s2043-superglobals,s2003-routecache
sonar.issue.ignore.multicriteria.s1523-tinker.ruleKey=php:S1523
sonar.issue.ignore.multicriteria.s1523-tinker.resourceKey=src/Adapters/Runtime/TinkerSession.php
sonar.issue.ignore.multicriteria.s1523-aot.ruleKey=php:S1523
sonar.issue.ignore.multicriteria.s1523-aot.resourceKey=src/Application/Container/Autowiring/AutowireAotCompiler.php

# STYLE-NOISE SUPPRESSIONS (2026-09-29, measured on PR #241). Brace
# placement, trailing-comment placement, filename-casing regexes and for-
# loop spacing are the domain of the repo's php-cs-fixer gate (PER-CS2.0 +
# Symfony + PhpCsFixer + PHP84 ruleset) — the single style authority this
# pipeline already enforces on every push. Sonar's counterparts encode a
# DIFFERENT single-convention model (S1105 and S1106 even contradict each
# other on the same file: the codebase legitimately mixes same-line control
# braces with next-line declaration braces, which PER-CS2.0 permits), so on
# the src/ tree they double-report style decisions the fixer already owns:
# 45 of 45 such findings on PR #241's new code were MINOR style noise, and
# the severity-weighted new_code_smells gate tripped on them (20 > 14) while
# the actual signal (one CRITICAL empty-method and one MAJOR class-length)
# was buried in the count. Style rules stay ACTIVE for real findings — this
# list is exactly the five duplicated-style rules, nothing broader.
#
# S2043 (direct superglobal access) is suppressed on RequestFactory.php
# alone: fromGlobals() IS the explicit, documented superglobal bridge this
# repository's request factory exposes (P-12, issue #171) — the access is
# the feature, and fromServer() never touches them. Same triage pattern as
# the S1523 criteria above (a by-design access surface on one named file).
#
# S2003 (include vs include_once) is suppressed on RouteCache.php alone:
# the cache artifact is a side-effect-free `<?php return array(...);`
# data file that loadIfFresh() must keep re-readable per call — a plain
# include returns the payload on EVERY read, while include_once hands
# back true after the first in-process include, turning every later read
# into a silent permanent soft-miss for long-running RoadRunner workers
# (the exact regression the includeEnvelope() docblock pins down). The
# re-execution hazard S2003 exists for cannot occur: the file carries no
# statements, only a single return. Same triage pattern as the criteria
# above (a by-design include surface on one named file).
sonar.issue.ignore.multicriteria.s1105-braces.ruleKey=php:S1105
sonar.issue.ignore.multicriteria.s1105-braces.resourceKey=src/**
sonar.issue.ignore.multicriteria.s1106-braces.ruleKey=php:S1106
sonar.issue.ignore.multicriteria.s1106-braces.resourceKey=src/**
sonar.issue.ignore.multicriteria.s139-trailing.ruleKey=php:S139
sonar.issue.ignore.multicriteria.s139-trailing.resourceKey=src/**
sonar.issue.ignore.multicriteria.s1578-filename.ruleKey=php:S1578
sonar.issue.ignore.multicriteria.s1578-filename.resourceKey=src/**
sonar.issue.ignore.multicriteria.s1808-forspace.ruleKey=php:S1808
sonar.issue.ignore.multicriteria.s1808-forspace.resourceKey=src/**
sonar.issue.ignore.multicriteria.s2043-superglobals.ruleKey=php:S2043
sonar.issue.ignore.multicriteria.s2043-superglobals.resourceKey=src/Adapters/Http/RequestFactory.php
sonar.issue.ignore.multicriteria.s2003-routecache.ruleKey=php:S2003
sonar.issue.ignore.multicriteria.s2003-routecache.resourceKey=src/Adapters/Router/RouteCache.php

# The quality gate is blocking: the scanner waits for the server-side verdict
# and the step (therefore the job) fails when the gate is red.
sonar.qualitygate.wait=true

# Coverage is deliberately NOT configured in this file (v2, 2026-09-28): the
# clover report only exists when the CI lane's "coverage-clover" artifact for
# this exact commit could be fetched, so the scanner arguments are computed
# per run by the workflow — sonar.php.coverage.reportPaths=build/clover.xml
# when the bridge succeeded, sonar.coverage.exclusions=**/* for that single
# run when it could not (always announced, never silent). See
# docs/security/sonarcloud.md section 6.
