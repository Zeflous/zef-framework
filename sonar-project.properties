# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.

# The projectKey and organization MUST match the values shown in SonarCloud
# (Project Administration > Project Key, and the organization key in the URL).
# These are the live, verified values (first credentialed analysis 2026-09-27,
# quality-gate decoration confirmed on PR #207). The parallel project
# zeflous_zef-framework in the SonarCloud organization "zeflous" is NOT
# referenced by this repository: the repo lives under the personal GitHub
# account mbetixz, and only the SonarCloud organization bound to that account
# can decorate pull-request comments — see docs/security/sonarcloud.md
# section 3, step 6.
sonar.projectKey=mbetixz_zef-framework
sonar.organization=mbetixz

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# modules/ and plugins/ are the framework's demo application code and are
# deliberately OUTSIDE this analysis (sonar.sources above). The CI lane's
# clover report still instruments them — phpunit.xml.dist includes src,
# modules and plugins, and the 90% coverage gate asserts on all three — so
# every bridged scan meets report entries that resolve to no analysed file,
# which sonar-php reports as the WARN "Failed to resolve 14 file path(s) in
# PHPUnit coverage clover.xml report. Nothing is imported related to
# file(s): .../modules/...;.../plugins/..." (measured on main,
# 2026-09-28 00:46 UTC). sonar.exclusion declares that scope decision to the
# PHP analyzer: it filters unresolved report paths through these patterns
# (verified against sonar-php's AbstractReportImporter), the expected
# warning disappears, and nothing else changes — the patterns match nothing
# under src/ or tests/. If the analysis scope is ever widened to include
# modules/ or plugins/, drop this line FIRST: sonar.exclusion would keep
# those files out of the analysis. The warning stays useful as a tripwire
# for paths outside these two directories. This is NOT a projectBaseDir
# problem: the scan action already passes -Dsonar.projectBaseDir=. and the
# log shows "Base dir: /home/runner/work/zef-framework/zef-framework",
# matching the clover paths — a wrong base dir would fail to resolve every
# file in the report, not exactly the out-of-scope ones.
sonar.exclusion=**/modules/**,**/plugins/**

# The quality gate is blocking: the scanner waits for the server-side verdict
# and the step (therefore the job) fails when the gate is red.
sonar.qualitygate.wait=true

# Coverage is deliberately NOT configured in this file (v2, 2026-09-28): the
# clover report only exists when the CI lane's "coverage-clover" artifact for
# this exact commit could be fetched, so the scanner arguments are computed
# per run by the workflow — sonar.php.coverage.reportPaths=build/clover.xml
# when the bridge succeeded, sonar.coverage.exclusions=**/* for that single
# run when it could not (always announced, never silent). See
# docs/security/sonarcloud.md section 6.
