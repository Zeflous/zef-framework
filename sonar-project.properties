# ZERO-DEBT FINAL ROUND (2026-09-29, PR #256, the last 31 findings). The
# in-code fixes cleared S6353 (concise \w classes on the route-param
# grammar), S2005 (merged split literals), S1142 (return consolidation in
# SecurityRuntimeMiddleware and RadixTreeNavigator), S2042 (PdoEventStore ->
# PdoEventStoreSchema and S3CompatibleStorage -> S3ListingParser splits),
# S126 (GenerateSpecCommand match restructure) and S3626 (redundant jump in
# ServiceInstantiator). The criteria below are the REMAINING documented
# by-design findings — every S5867 one is an ASCII grammar contract that
# cannot go Unicode-aware without changing observable behaviour:
#   * Route-param grammar {name:constraint} with [A-Za-z_]\w* — parameters
#     are PHP-identifier-shaped by design: RoutePatternParser, UrlGenerator,
#     PostmanCollectionExporter (:param rewriting), RoutePathParameterFactory.
#   * Wire-format charsets: RFC 6750 b64token on the Bearer redaction
#     (TelemetrySanitizer — the pattern already carries the u flag over
#     UTF-8-scrubbed input; only the token charset is ASCII), base64url+hex
#     CSRF token bodies (CsrfTokenManager), RFC 7230 token grammar for
#     cookie/header names (SecurityPolicy — see the inline docblock).
#   * Prometheus naming spec [a-zA-Z_:][a-zA-Z0-9_:]* — metric and label
#     names MUST be ASCII (PrometheusRenderer).
#   * ASCII-only sanitizers/identifiers by contract: health indicator keys
#     (HealthAggregator), validator names (ConfigurationGovernance), and the
#     alpha/slug URL-segment constraints (RouteConstraintValidator).
# S1200 on RouteMetadataAccumulator: the collector's dependency count equals
# the OpenAPI attribute/value-object vocabulary it exists to assemble (one
# apply* method per attribute family, read in a single reflection pass);
# splitting it scatters that one pass across N classes without reducing
# real coupling — the same triage pattern as s1448/s2042-querybuilder.
