# SonarCloud analysis configuration, read by the scanner step of
# .github/workflows/sonarcloud.yml. Scope and policy decisions are documented
# in docs/security/sonarcloud.md.

# The projectKey and organization MUST match the values shown in SonarCloud
# (Project Administration > Project Key, and the organization key in the URL).
# The defaults below follow the SonarCloud convention for this repository;
# adjust them in the same pull request that performs the first-time setup if
# SonarCloud assigned different values.
sonar.projectKey=mbetixz_zef-framework
sonar.organization=mbetixz

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# The quality gate is blocking: the scanner waits for the server-side verdict
# and the step (therefore the job) fails when the gate is red.
sonar.qualitygate.wait=true

# Coverage bridge (v1). PHPUnit coverage is produced in the main CI job but
# not yet exported to this lane; wiring the artifact hand-off is tracked in
# docs/security/sonarcloud.md section 6. Until then coverage is excluded so
# the default "Sonar way" gate's coverage-on-new-code condition does not fail
# on absent data. Bugs, vulnerabilities, code smells, duplications, security
# hotspots and new-code reliability conditions remain fully enforced.
sonar.coverage.exclusions=**/*
