# STYLE-NOISE SUPPRESSIONS (2026-09-29, measured on PR #241). Brace
# placement, trailing-comment placement, filename-casing regexes and for-
# loop spacing are the domain of the repo's php-cs-fixer gate (PER-CS2.0 +
# Symfony + PhpCsFixer + PHP84 ruleset) — the single style authority this
# pipeline already enforces on every push. Sonar's counterparts encode a
# DIFFERENT single-convention model (S1105 and S1106 even contradict each
# other on the same file: the codebase legitimately mixes same-line control
# braces with next-line declaration braces, which PER-CS2.0 permits), so on
# the src/ tree they double-report style decisions the fixer already owns:
# 45 of 45 such findings on PR #241's new code were MINOR style noise, and
# the severity-weighted new_code_smells gate tripped on them (20 > 14) while
# the actual signal (one CRITICAL empty-method and one MAJOR class-length)
# was buried in the count. Style rules stay ACTIVE for real findings — this
# list is exactly the five duplicated-style rules, nothing broader.
#
# S2043 (direct superglobal access) is suppressed on RequestFactory.php
# alone: fromGlobals() IS the explicit, documented superglobal bridge this
# repository's request factory exposes (P-12, issue #171) — the access is
# the feature, and fromServer() never touches them. Same triage pattern as
# the S1523 criteria above (a by-design access surface on one named file).
#
# S2003 (include vs include_once) is suppressed on RouteCache.php alone:
# the cache artifact is a side-effect-free `<?php return array(...);`
# data file that loadIfFresh() must keep re-readable per call — a plain
# include returns the payload on EVERY read, while include_once hands
# back true after the first in-process include, turning every later read
# into a silent permanent soft-miss for long-running RoadRunner workers
# (the exact regression the includeEnvelope() docblock pins down). The
# re-execution hazard S2003 exists for cannot occur: the file carries no
# statements, only a single return. Same triage pattern as the criteria
# above (a by-design include surface on one named file).
sonar.issue.ignore.multicriteria.s1105-braces.ruleKey=php:S1105
sonar.issue.ignore.multicriteria.s1105-braces.resourceKey=src/**
